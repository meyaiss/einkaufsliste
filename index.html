<script>
try{
  var d = JSON.parse(localStorage.getItem("ezettel.v1.design") || "{}"), r = document.documentElement;
  if (d.palette && d.palette !== "gruen") r.setAttribute("data-palette", d.palette);
  if (d.mode === "light" || d.mode === "dark") r.setAttribute("data-theme", d.mode);
  if (d.shape === "rund") r.setAttribute("data-shape", "rund");
  if (d.font === "gross" || d.font === "sehrgross") r.setAttribute("data-font", d.font);
}catch(e){}
</script>
<!-- Schriften liegen in der App selbst (vendor/fonts) – keine Verbindung zu Google -->
<style>
/* Layout: one narrow column like a shop's aisle board; sections are aisles in walking order, cart collects what's done */
:root{
  --bg:#EEF2EE;
  --surface:#FFFFFF;
  --fg:#14211B;
  --muted:#5A6B62;
  --line:#D5DDD7;
  --aisle:#1E5A44;
  --aisle-fg:#FFFFFF;
  --cat:#3E7560;
  --tag:#F4C430;
  --tag-fg:#1B1A10;
  --done:#8A9A91;
  --danger:#B3261E;
  --font-sign:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1512;--surface:#16201B;--fg:#E6EEE9;--muted:#93A59B;--line:#27352E;
  --aisle:#2F7C5F;--aisle-fg:#F2FBF6;--cat:#8CC4AA;--tag:#F2C641;--tag-fg:#1B1A10;--done:#64766C;--danger:#F2867E;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512;--surface:#16201B;--fg:#E6EEE9;--muted:#93A59B;--line:#27352E;
  --aisle:#2F7C5F;--aisle-fg:#F2FBF6;--cat:#8CC4AA;--tag:#F2C641;--tag-fg:#1B1A10;--done:#64766C;--danger:#F2867E;
  color-scheme:dark}

/* Farbdesigns (Grün ist der Standard oben). Jede Palette hat hell und dunkel. */
:root[data-palette="blau"]{--bg:#EEF2F7;--surface:#FFFFFF;--fg:#131B26;--muted:#59667A;--line:#D3DBE6;--aisle:#1F4E8C;--aisle-fg:#FFFFFF;--cat:#3A6299;--tag:#F4C430;--tag-fg:#1B1A10;--done:#8792A3}
@media (prefers-color-scheme: dark){:root[data-palette="blau"]:not([data-theme="light"]){--bg:#0D121A;--surface:#151C27;--fg:#E5ECF5;--muted:#93A1B5;--line:#263244;--aisle:#3570B8;--aisle-fg:#F3F7FD;--cat:#9DBBE6;--tag:#F2C641;--tag-fg:#1B1A10;--done:#647187;color-scheme:dark}}
:root[data-palette="blau"][data-theme="dark"]{--bg:#0D121A;--surface:#151C27;--fg:#E5ECF5;--muted:#93A1B5;--line:#263244;--aisle:#3570B8;--aisle-fg:#F3F7FD;--cat:#9DBBE6;--tag:#F2C641;--tag-fg:#1B1A10;--done:#647187;color-scheme:dark}
:root[data-palette="beere"]{--bg:#F7EFF2;--surface:#FFFFFF;--fg:#25131B;--muted:#79606B;--line:#E8D5DD;--aisle:#8A2851;--aisle-fg:#FFFFFF;--cat:#9A4468;--tag:#F7C5D3;--tag-fg:#3A0F22;--done:#A18C95}
@media (prefers-color-scheme: dark){:root[data-palette="beere"]:not([data-theme="light"]){--bg:#170E13;--surface:#22161C;--fg:#F5E8EE;--muted:#B596A4;--line:#3A2530;--aisle:#B03D6C;--aisle-fg:#FFF4F8;--cat:#E7A3BE;--tag:#F2A9C0;--tag-fg:#3A0F22;--done:#7D6470;color-scheme:dark}}
:root[data-palette="beere"][data-theme="dark"]{--bg:#170E13;--surface:#22161C;--fg:#F5E8EE;--muted:#B596A4;--line:#3A2530;--aisle:#B03D6C;--aisle-fg:#FFF4F8;--cat:#E7A3BE;--tag:#F2A9C0;--tag-fg:#3A0F22;--done:#7D6470;color-scheme:dark}
:root[data-palette="sonne"]{--bg:#FBF4EC;--surface:#FFFFFF;--fg:#24170C;--muted:#7A6450;--line:#ECDCCB;--aisle:#B4501A;--aisle-fg:#FFFFFF;--cat:#A85A2A;--tag:#FFD25E;--tag-fg:#2A1C05;--done:#A69280}
@media (prefers-color-scheme: dark){:root[data-palette="sonne"]:not([data-theme="light"]){--bg:#17110B;--surface:#221A12;--fg:#F7EDE3;--muted:#B8A08A;--line:#3A2B1E;--aisle:#D0682B;--aisle-fg:#FFF8F1;--cat:#F2B48A;--tag:#F5C94F;--tag-fg:#2A1C05;--done:#7E6B5A;color-scheme:dark}}
:root[data-palette="sonne"][data-theme="dark"]{--bg:#17110B;--surface:#221A12;--fg:#F7EDE3;--muted:#B8A08A;--line:#3A2B1E;--aisle:#D0682B;--aisle-fg:#FFF8F1;--cat:#F2B48A;--tag:#F5C94F;--tag-fg:#2A1C05;--done:#7E6B5A;color-scheme:dark}
:root[data-palette="lavendel"]{--bg:#F2F0F8;--surface:#FFFFFF;--fg:#1A1626;--muted:#665F7C;--line:#DCD7EA;--aisle:#5B4A9E;--aisle-fg:#FFFFFF;--cat:#6C5CAF;--tag:#C9F07A;--tag-fg:#1C2408;--done:#948DAA}
@media (prefers-color-scheme: dark){:root[data-palette="lavendel"]:not([data-theme="light"]){--bg:#110F18;--surface:#1A1724;--fg:#ECE9F7;--muted:#A39CBD;--line:#2E2940;--aisle:#7B68C8;--aisle-fg:#F7F5FF;--cat:#BBAEF0;--tag:#B8E36A;--tag-fg:#1C2408;--done:#6E6887;color-scheme:dark}}
:root[data-palette="lavendel"][data-theme="dark"]{--bg:#110F18;--surface:#1A1724;--fg:#ECE9F7;--muted:#A39CBD;--line:#2E2940;--aisle:#7B68C8;--aisle-fg:#F7F5FF;--cat:#BBAEF0;--tag:#B8E36A;--tag-fg:#1C2408;--done:#6E6887;color-scheme:dark}
:root[data-palette="graphit"]{--bg:#F1F2F4;--surface:#FFFFFF;--fg:#15181D;--muted:#5F6672;--line:#D9DCE1;--aisle:#2E3440;--aisle-fg:#FFFFFF;--cat:#4E5766;--tag:#F4C430;--tag-fg:#1B1A10;--done:#8D939C}
@media (prefers-color-scheme: dark){:root[data-palette="graphit"]:not([data-theme="light"]){--bg:#0E1013;--surface:#181B20;--fg:#E8EAED;--muted:#9AA1AC;--line:#2A2F37;--aisle:#56607A;--aisle-fg:#F4F6F9;--cat:#AEB7C6;--tag:#F2C641;--tag-fg:#1B1A10;--done:#6A717C;color-scheme:dark}}
:root[data-palette="graphit"][data-theme="dark"]{--bg:#0E1013;--surface:#181B20;--fg:#E8EAED;--muted:#9AA1AC;--line:#2A2F37;--aisle:#56607A;--aisle-fg:#F4F6F9;--cat:#AEB7C6;--tag:#F2C641;--tag-fg:#1B1A10;--done:#6A717C;color-scheme:dark}

/* Form „Rund“: weichere Ecken, runde Häkchen, Knöpfe als Pillen */
:root[data-shape="rund"]{--r:20px}
:root[data-shape="rund"] .btn,:root[data-shape="rund"] .add input,:root[data-shape="rund"] .chip{border-radius:999px}
:root[data-shape="rund"] .btn.icon{border-radius:50%;padding:0;width:50px;height:50px}
:root[data-shape="rund"] .box{border-radius:50%}
:root[data-shape="rund"] .qty{border-radius:999px;padding:2px 10px}
:root[data-shape="rund"] ul.items{border:0;box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)}
:root[data-shape="rund"] ul.items{overflow:hidden}
:root[data-shape="rund"] ul.items li{border-top-color:transparent}
:root[data-shape="rund"] .rowin{padding-inline:8px}
:root[data-shape="rund"] ul.items li + li{border-top:1px solid var(--line)}
:root[data-shape="rund"] .sheet{border-radius:28px 28px 0 0}
:root[data-shape="rund"] .field input,:root[data-shape="rund"] .field select,:root[data-shape="rund"] .ta{border-radius:14px}
:root[data-shape="rund"] .found,:root[data-shape="rund"] .empty,:root[data-shape="rund"] .allgood,:root[data-shape="rund"] .imprev li,:root[data-shape="rund"] .route li{border-radius:16px}
:root[data-shape="rund"] .toast{border-radius:999px;padding-left:20px}
:root[data-shape="rund"] .scanbox{border-radius:22px}

/* Design-Auswahl */
.swatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--line);background:var(--bg);border-radius:var(--r);padding:10px 6px;text-align:center;min-width:0}
.swatch .dots{display:flex;flex:0 0 auto}
.swatch .dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--surface);margin-left:-6px}
.swatch .dots i:first-child{margin-left:0}
.swatch span{font-size:calc(15px*var(--fs));font-weight:700;min-width:0}
.swatch[aria-pressed="true"],.seg button[aria-pressed="true"]{border-color:var(--aisle);box-shadow:inset 0 0 0 1px var(--aisle)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{border:2px solid var(--line);background:var(--bg);border-radius:var(--r);padding:11px 4px;font-weight:700;font-size:calc(15px*var(--fs));min-width:0}
.seg button b{display:block}
.seg button small{display:block;font-weight:400;font-size:calc(12px*var(--fs));color:var(--muted);margin-top:2px}
.seg .shape-demo{display:block;margin:0 auto 6px;width:34px;height:22px;border:3px solid var(--aisle);border-radius:4px}
.seg .shape-demo.round{border-radius:999px}
.design-label{font-size:calc(13px*var(--fs));color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:0}
@media (max-width:360px){.swatches{grid-template-columns:repeat(2,minmax(0,1fr))}}


*{box-sizing:border-box}
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Schriftgröße (Design) und Einkaufsmodus vergrößern alle Texte */
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(vendor/fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(vendor/fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(vendor/fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(vendor/fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
:root{--fsb:1;--fs:var(--fsb)}
:root[data-font="gross"]{--fsb:1.15}
:root[data-font="sehrgross"]{--fsb:1.3}
body.shopmode{--fs:calc(var(--fsb) * 1.2)}
body{margin:0;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:calc(17px*var(--fs));line-height:1.4}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:grid;gap:8px;border-bottom:1px solid var(--line);transition:transform .25s ease}
/* Beim Runterscrollen verschwindet die Kopfzeile, beim Hochscrollen kommt sie zurück */
header.away{transform:translateY(calc(-100% - env(safe-area-inset-top,0px) - 2px))}
.top{display:flex;align-items:center;gap:12px}
header{grid-template-columns:minmax(0,1fr)}
.sub{display:flex;align-items:center;gap:12px;min-width:0}
.sub .progress{flex:1 1 90px;min-width:0}
/* Markt-Knopf: dezent statt großer Pille */
.sub .store{background:var(--surface);color:var(--fg);border:1.5px solid var(--line);padding:6px 10px 6px 10px;gap:6px;flex:0 1 auto;min-width:0;max-width:62%}
.sub .store .lbl{display:none}
.sub .store b{font-weight:700;font-size:calc(15px*var(--fs))}
.sub .store .si{flex:0 0 auto;width:18px;height:18px;fill:none;stroke:var(--aisle);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sub .store svg:last-child{stroke:var(--muted);width:16px;height:16px}
.iconbtn{flex:0 0 auto;width:46px;height:46px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center}
.iconbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
:root[data-shape="rund"] .iconbtn{border-radius:50%}
h1{font-family:var(--font-sign);font-weight:700;font-size:calc(27px*var(--fs));letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance;flex:1 1 auto;min-width:0}
.listbtn{display:inline-flex;align-items:center;gap:6px;max-width:100%;border:0;background:none;padding:4px 0;font:inherit;color:inherit;letter-spacing:inherit;text-align:left;cursor:pointer}
.listbtn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listbtn svg{flex:0 0 auto;width:22px;height:22px;fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.store{display:flex;align-items:center;gap:6px;background:var(--aisle);color:var(--aisle-fg);border-radius:999px;padding:4px 6px 4px 14px}
#storeChip b{max-width:46vw}
/* Marktwahl: erst Art, dann Name */
.pk-sec{font-size:calc(13px*var(--fs));color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:4px 2px -6px}
.pk-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.pk-type{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--bg);color:var(--fg);border-radius:var(--r);padding:10px 12px;font:inherit;font-weight:700;text-align:left;cursor:pointer;min-width:0}
.pk-type span{min-width:0;font-size:calc(15px*var(--fs));line-height:1.15;hyphens:auto;overflow-wrap:anywhere}
.pk-type i{font-style:normal;font-size:calc(20px*var(--fs));flex:0 0 auto}
.pk-type[aria-pressed="true"]{border-color:var(--aisle);background:var(--aisle);color:var(--aisle-fg)}
.pk-more{border:0;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:calc(14px*var(--fs));padding:6px 2px;text-align:left;cursor:pointer;justify-self:start}
.pk-names{display:grid}
.pickbtn{width:auto!important;padding:0 12px;font-weight:700;font-size:calc(14px*var(--fs))!important}
.pk-name{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--fg);font:inherit;text-align:left;padding:12px 14px;cursor:pointer}
.pk-name + .pk-name{border-top:1px solid var(--line)}
.pk-name b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pk-name small{color:var(--muted);font-size:calc(13px*var(--fs))}
.pk-name.on b{font-weight:800}
.pk-name svg{width:20px;height:20px;fill:none;stroke:var(--aisle);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.pk-recent{display:flex;gap:8px;flex-wrap:wrap}
.pk-recent .chip{border-style:solid;border-color:var(--line)}
.pk-recent .chip.on{border-color:var(--aisle)}
.shopsbtn{border:0;font:inherit;cursor:pointer;padding:8px 12px 8px 14px;max-width:100%;min-width:0}
.shopsbtn .lbl{font-family:var(--font-sign);font-size:calc(14px*var(--fs));text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.shopsbtn b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shopsbtn svg{flex:0 0 auto;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.shop{margin-top:22px}
.shophead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r);background:var(--aisle);color:var(--aisle-fg);font-family:var(--font-sign);font-size:calc(21px*var(--fs));font-weight:700;letter-spacing:.01em}
.shophead span{flex:1;min-width:0}
.shophead small{font-size:calc(15px*var(--fs));opacity:.85;font-variant-numeric:tabular-nums}
.shophead button{border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:8px;padding:4px 10px;font:inherit;font-size:calc(13px*var(--fs));font-weight:700;font-family:var(--font-body)}
.shop .aisle:first-of-type{margin-top:12px}
.shoprow{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px}
.shoprow + .shoprow{border-top:1px solid var(--line)}
.shoprow .nm{flex:1;min-width:0}
.shoprow small{color:var(--muted)}
.shoprow button{width:40px;height:40px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-size:calc(16px*var(--fs));color:var(--fg)}
.shoprow button:disabled{opacity:.3}
.progress{display:flex;align-items:center;gap:10px;font-size:calc(13px*var(--fs));white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--aisle);transition:width .3s}

/* add */
.add{display:flex;gap:8px;margin-top:14px}
.add input{flex:1;min-width:0;border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px}
.add input:focus{border-color:var(--aisle);outline:none}
.btn{border:0;border-radius:var(--r);padding:12px 16px;font-weight:700;background:var(--aisle);color:var(--aisle-fg)}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line)}
.btn.tag{background:var(--tag);color:var(--tag-fg)}
.inwrap{position:relative;flex:1;min-width:0;display:flex}
.inwrap input{padding-left:42px;padding-right:50px;-webkit-appearance:none;appearance:none}
.inwrap input::-webkit-search-cancel-button{display:none}
.lupe{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;pointer-events:none}
.btn.icon{flex:0 0 auto;width:50px;height:50px;padding:0}
#addBtn svg{stroke-width:2.8}
.btn.icon.ghost-icon{background:var(--surface);color:var(--aisle);border:2px solid var(--line)}
.sugg{display:flex;gap:8px;overflow-x:auto;padding-block:10px 2px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg .chip{border-style:solid;border-color:var(--aisle);background:var(--surface)}
.sugg .dishchip{display:inline-flex;align-items:center;gap:6px;background:var(--aisle);color:var(--aisle-fg);border-color:var(--aisle)}
.sugg .dishchip svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sugg .dishchip small{color:inherit;opacity:.8}
.sugg .chip small{color:var(--muted);margin-left:6px;font-size:calc(13px*var(--fs))}
.mic{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;border-radius:8px;color:var(--aisle);display:grid;place-items:center}
.mic svg,.btn.icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mic.on{background:var(--danger);color:#fff;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.btn.icon{padding:10px 12px;display:grid;place-items:center}
.scanbox{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;width:100%;max-width:100%}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .frame{position:absolute;left:10%;right:10%;top:28%;bottom:28%;border:3px solid var(--tag);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scanbox .laser{position:absolute;left:12%;right:12%;top:50%;height:2px;background:#E5484D;opacity:.85}
.found{display:grid;gap:10px;padding:12px;border-radius:10px;background:var(--bg)}
.found .meta{font-size:calc(14px*var(--fs));color:var(--muted)}
.btn.danger{background:transparent;color:var(--danger);border:2px solid currentColor}
/* Kurze Tour beim ersten Start */
.tour{position:fixed;inset:0;z-index:40}
.tour-hole{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(5,12,9,.62);outline:3px solid var(--tag);outline-offset:2px;transition:top .3s ease,left .3s ease,width .3s ease,height .3s ease;pointer-events:none}
.tour-card{position:fixed;left:16px;right:16px;max-width:440px;margin:0 auto;background:var(--surface);color:var(--fg);border-radius:14px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.35);display:grid;gap:12px;transition:top .3s ease,bottom .3s ease}
.tour-card p{margin:0;line-height:1.45}
.tour-card p b{display:block;font-size:calc(18px*var(--fs));margin-bottom:2px}
.tour-foot{display:flex;align-items:center;gap:8px}
.tour-foot .dots{flex:1;font-size:calc(13px*var(--fs));color:var(--muted);font-variant-numeric:tabular-nums}
.tour-foot .btn{padding:10px 16px}
.tour-skip{border:0;background:none;color:var(--muted);font:inherit;font-weight:700;padding:10px 8px}
.shareico{flex:0 0 auto;width:20px!important;height:20px!important;stroke:var(--aisle)!important;stroke-width:2!important;margin-left:2px}
.shareico.off{stroke:var(--muted)!important;opacity:.7}
.sync-status{display:flex;align-items:center;gap:8px;color:var(--fg)}
.sync-status .dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;background:#2E9E5B}
.sync-status .dot.off{background:var(--muted)}
.qrbox{background:#fff;border-radius:12px;padding:10px;width:min(240px,70vw);margin:0 auto}
.qrbox svg{display:block;width:100%;height:auto}
details.adv summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:calc(14px*var(--fs));padding:4px 0}
.legal{display:grid;gap:12px;font-size:calc(15px*var(--fs));line-height:1.5}
.legal p{margin:0}
.legal a{color:var(--aisle)}
.legal .ph{background:color-mix(in srgb,var(--tag) 40%,transparent);padding:0 4px;border-radius:4px}
.introbar{display:grid;gap:8px;padding:12px;border-radius:var(--r);background:color-mix(in srgb,var(--tag) 22%,var(--bg));font-size:calc(15px*var(--fs))}
.introbar .row{align-items:center}
.introbar .btn{flex:0 0 auto;padding:8px 14px}
.introbar .tour-skip{flex:0 0 auto}
.linkbtn{border:0;background:none;padding:0;color:var(--aisle);font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.welcome-ico{font-size:calc(40px*var(--fs));line-height:1}
.support-links{display:grid;gap:8px}
.wipe-list{margin:-6px 0 0;padding-left:20px;display:grid;gap:2px;color:var(--fg)}
.hint{font-size:calc(13px*var(--fs));color:var(--muted);margin:8px 2px 0}
.hint[hidden]{display:none}

.chips{display:flex;gap:8px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px dashed var(--muted);background:transparent;border-radius:999px;padding:6px 12px;font-size:calc(15px*var(--fs));color:var(--fg)}
.chip b{color:var(--aisle);margin-right:4px}
.chips-label{font-family:var(--font-sign);font-size:calc(12px*var(--fs));letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:12px}

/* aisles */
.aisle{margin-top:16px}
.sign{display:flex;align-items:baseline;gap:10px;padding:0 4px;color:var(--cat);font-family:var(--font-sign)}
.sign .name{font-size:calc(13px*var(--fs));font-weight:600;letter-spacing:.09em;text-transform:uppercase;flex:1;min-width:0}
.sign .count{font-size:calc(13px*var(--fs));font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

ul.items{list-style:none;margin:6px 0 0;padding:0;background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
ul.items li{position:relative;overflow:hidden;border-top:1px solid var(--line)}
.rowin{position:relative;display:flex;align-items:center;gap:4px;min-height:52px;background:var(--surface);touch-action:pan-y}
.rowin.snap{transition:transform .2s ease}
.sw-bg{position:absolute;inset:0;display:none;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700;color:#fff}
.sw-bg span{display:flex;align-items:center;gap:8px}
.sw-bg svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
li.sw-right .sw-bg{display:flex;background:var(--aisle)}
li.sw-left .sw-bg{display:flex;background:var(--danger)}
li.sw-right .sw-r, li.sw-left .sw-l{visibility:hidden}
li.sw-go .sw-bg span{transform:scale(1.08)}
.price{flex:0 0 auto;font-size:calc(14px*var(--fs));color:var(--muted);font-variant-numeric:tabular-nums}
li.done .price{text-decoration:line-through}
.sumline{font-size:calc(14px*var(--fs));color:var(--muted);font-variant-numeric:tabular-nums}
.sumline b{color:var(--fg)}
ul.items li:first-child{border-top:0}
.tick{flex:1;min-width:0;display:flex;align-items:center;gap:14px;background:none;border:0;text-align:left;padding:10px 4px 10px 14px}
.box{flex:0 0 calc(28px*var(--fs));height:calc(28px*var(--fs));border:2.5px solid var(--aisle);border-radius:7px;display:grid;place-items:center;transition:background .15s}
.box svg{width:18px;height:18px;opacity:0;stroke:var(--aisle-fg);stroke-width:3.2;fill:none}
.label{min-width:0;overflow-wrap:anywhere}
.iico{flex:0 0 auto;font-size:calc(20px*var(--fs));line-height:1;margin-right:-4px;width:1.3em;text-align:center}
li.done .iico{opacity:.45;filter:grayscale(1)}
.qty{flex:0 0 auto;background:var(--tag);color:var(--tag-fg);font-weight:700;font-size:calc(14px*var(--fs));border-radius:4px;padding:2px 8px;font-variant-numeric:tabular-nums}
.more{flex:0 0 auto;width:44px;height:48px;border:0;background:none;color:var(--muted);font-size:calc(20px*var(--fs));border-radius:8px;opacity:.5}
.more:hover,.more:focus-visible{opacity:1}
li.done .box{background:var(--aisle)}
li.done .box svg{opacity:1}
li.done .label{color:var(--done);text-decoration:line-through}
li.done .qty{background:var(--line);color:var(--muted)}
li.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.97)}100%{transform:scale(1)}}

.cart{margin-top:28px}
.cart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cart-head h2{font-family:var(--font-sign);font-size:calc(22px*var(--fs));margin:0;color:var(--muted)}
.cart-head button{padding:8px 12px;font-size:calc(15px*var(--fs))}

.empty{margin-top:28px;padding:22px;border:2px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:left}
.empty strong{display:block;color:var(--fg);font-size:calc(19px*var(--fs));margin-bottom:4px}
.allgood{margin-top:20px;padding:16px 18px;border-radius:var(--r);background:var(--aisle);color:var(--aisle-fg);font-weight:700;display:grid;gap:10px;justify-items:start}
.learnrow{display:flex;gap:8px;flex-wrap:wrap}
.learnno{background:rgba(255,255,255,.16);color:inherit}
.allgood p{margin:0;font-weight:400;font-size:calc(15px*var(--fs))}
.inote{display:block;font-size:calc(14px*var(--fs));color:var(--muted);text-decoration:none}
li.done .inote{color:var(--done)}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr) minmax(0,1.1fr);gap:8px;align-items:end}
.eurwrap{position:relative}
.eurwrap input{padding-right:34px}
.eurwrap span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.qgrid .times{padding-bottom:12px;color:var(--muted);font-weight:700}
@media (max-width:380px){.qgrid{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.qgrid .field:last-child{grid-column:1 / -1}}

/* Anleitungen in Senden/Empfangen */
.howto{margin:0;padding-left:22px;display:grid;gap:6px;font-size:calc(15px*var(--fs))}
.howto.plat{list-style:none;padding-left:0}
.howto-box{background:var(--bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
#imSrc:empty{display:none}

/* Listen, Gerichte, Sicherung */
.lrow{display:flex;align-items:center}
.lrow + .lrow{border-top:1px solid var(--line)}
.lrow .menu-row{flex:1;min-width:0}
.lrow .pill{flex:0 0 auto}
.servrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-radius:var(--r);padding:8px 8px 8px 14px;font-weight:700}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border:2px solid var(--line);background:var(--surface);border-radius:var(--r);font-size:calc(22px*var(--fs));font-weight:700;color:var(--aisle)}
.stepper b{min-width:32px;text-align:center;font-size:calc(20px*var(--fs));font-variant-numeric:tabular-nums}
:root[data-shape="rund"] .stepper button{border-radius:50%}
.mname i{color:var(--muted)}

/* Oft gekauft – Einstellungen */
.fqlist{list-style:none;margin:0;padding:0;background:var(--bg);border-radius:var(--r);max-height:40vh;overflow:auto}
.fqlist li{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px}
.fqlist li + li{border-top:1px solid var(--line)}
.fqname{flex:1;min-width:0;overflow-wrap:anywhere}
.fqn{color:var(--muted);font-size:calc(14px*var(--fs));font-variant-numeric:tabular-nums}
.fqdel{width:40px;height:40px;border:0;background:none;color:var(--muted);font-size:calc(18px*var(--fs));border-radius:8px}

/* Update-Hinweis */
.updbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:2px solid var(--aisle);border-radius:var(--r);padding:8px 8px 8px 14px;font-weight:700;font-size:calc(15px*var(--fs))}
.updbtns{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.updx{border:0;background:none;color:var(--muted);font-size:calc(18px*var(--fs));width:40px;height:40px;border-radius:8px;cursor:pointer}
.updbar .btn{padding:8px 14px;font-size:calc(15px*var(--fs))}
.vers{font-size:calc(13px*var(--fs));color:var(--muted);margin:0;font-variant-numeric:tabular-nums}

/* Menü */
.menu-group{display:grid;gap:6px}
.menu-title{font-size:calc(13px*var(--fs));color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:4px 2px 0}
.menu-card{background:var(--bg);border-radius:var(--r);overflow:hidden}
.menu-row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 12px;text-align:left;color:var(--fg)}
.menu-row + .menu-row{border-top:1px solid var(--line)}
.menu-row:active{background:var(--line)}
.radio{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.menu-row[aria-checked="true"] .radio{border:7px solid var(--aisle)}
.mi{flex:0 0 34px;height:34px;border-radius:9px;background:color-mix(in srgb,var(--aisle) 14%,transparent);color:var(--aisle);display:grid;place-items:center}
.mi svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mt{flex:1;min-width:0;display:grid;gap:1px}
.mt b{font-size:calc(16px*var(--fs))}
.mt small{font-size:calc(13px*var(--fs));color:var(--muted);line-height:1.3}
.mt small:empty{display:none}
.menu-stack{display:grid;gap:10px}
.chev{flex:0 0 auto;color:var(--muted);font-size:calc(24px*var(--fs));line-height:1}
.switch{flex:0 0 auto;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.menu-row[aria-checked="true"] .switch{background:var(--aisle)}
.menu-row[aria-checked="true"] .switch::after{transform:translateX(20px)}
.menu-row.danger .mi{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.menu-row.danger b{color:var(--danger)}
.menu-row:disabled{opacity:.45}
.menu-info{font-size:calc(13px*var(--fs));color:var(--muted);margin:2px 2px 0;max-width:60ch}
.menu-info a{color:inherit}
:root[data-shape="rund"] .menu-card{border-radius:18px}
:root[data-shape="rund"] .mi{border-radius:50%}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(5,12,9,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:16px 16px 0 0;max-height:88vh;overflow:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet .in{max-width:620px;margin:0 auto;display:grid;gap:14px}
.sheet h3{font-family:var(--font-sign);font-size:calc(24px*var(--fs));margin:0}
.field{display:grid;gap:4px}
.field label{font-size:calc(13px*var(--fs));color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.field input,.field select{border:2px solid var(--line);background:var(--bg);border-radius:var(--r);padding:11px 12px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 auto}
.route{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.route li{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:8px;padding:6px 6px 6px 0;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.route .grip{flex:0 0 auto;width:40px;align-self:stretch;display:grid;place-items:center;color:var(--muted);font-size:calc(20px*var(--fs));cursor:grab;touch-action:none}
.route li.dragging{z-index:3;background:var(--surface);box-shadow:0 8px 24px rgba(0,0,0,.22);outline:2px solid var(--aisle);cursor:grabbing}
.route li.dragging .grip{color:var(--aisle)}
.route.sorting li:not(.dragging){transition:transform .12s}
.route.sorting{touch-action:none}
.route .nm{flex:1;min-width:0}
.route button{width:40px;height:40px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-size:calc(18px*var(--fs))}
.route button:disabled{opacity:.3}
.note{font-size:calc(14px*var(--fs));color:var(--muted);margin:0}

.ta{width:100%;min-height:180px;border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--fg);font:inherit;font-size:calc(15px*var(--fs));resize:vertical}
.ta:focus{border-color:var(--aisle);outline:none}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.filebtn{display:block;text-align:center;cursor:pointer}
.filebtn:has(+ #imFile:focus-visible){outline:3px solid var(--tag);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
details.alt{border-top:1px solid var(--line);padding-top:10px}
details.alt summary{cursor:pointer;color:var(--muted);font-size:calc(15px*var(--fs));padding:4px 0}
details.alt[open]{display:grid;gap:10px}
.btn.wa{background:#1F8F4E;color:#fff;text-decoration:none;text-align:center}
.imprev ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:34vh;overflow:auto}
.imprev li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;background:var(--bg);border-radius:8px}
.imprev li span{min-width:0;overflow-wrap:anywhere}
.imprev i{color:var(--muted)}
.pill{flex:0 0 auto;font-style:normal;font-size:calc(12px*var(--fs));font-weight:700;border-radius:99px;padding:3px 9px}
.pill.new{background:var(--aisle);color:var(--aisle-fg)}
.pill.fill{background:var(--tag);color:var(--tag-fg)}
.pill.skip{background:var(--line);color:var(--muted)}
.imprev li.mrow{padding:6px 10px}
.mcheck{display:flex;align-items:center;gap:12px;width:100%;cursor:pointer}
.mcheck input{width:22px;height:22px;flex:0 0 auto;accent-color:var(--aisle)}
.mcheck > span{display:grid;min-width:0}
.mcheck small{font-size:calc(13px*var(--fs));color:var(--muted)}
.mcheck small b{color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.3)}
.toast button{background:var(--tag);color:var(--tag-fg);border:0;border-radius:8px;padding:8px 12px;font-weight:700}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Einkaufsmodus: nur die offene Liste, groß und ruhig */
.shopbtn{display:none}
.shopbtn.show{display:grid}
.shopbtn[aria-pressed="true"]{background:var(--aisle);color:var(--aisle-fg);border-color:var(--aisle)}
.shopbar{display:none;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-radius:var(--r);background:var(--aisle);color:var(--aisle-fg);font-weight:700}
.shopbar span{flex:1;min-width:0}
.shopbar button{border:0;border-radius:8px;background:rgba(255,255,255,.2);color:inherit;font:inherit;font-weight:700;padding:6px 12px}
body.shopmode .shopbar{display:flex}
body.shopmode .add, body.shopmode #sugg, body.shopmode #hint, body.shopmode #freqWrap, body.shopmode .cart ul.items, body.shopmode .cart-head button{display:none!important}
body.shopmode .rowin{min-height:60px}
body.shopmode .cart{margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1><button class="listbtn" id="listBtn" type="button" aria-label="Liste wechseln"><span id="listTitle" translate="no">Einkaufsliste</span><svg class="shareico" id="shareIco" viewBox="0 0 24 24" aria-label="Gemeinsame Liste" hidden><circle cx="9" cy="8" r="3.2"/><path d="M3 19.5c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.6c2.6-.3 4.6 1.3 5 4.4"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></h1>
      <button class="iconbtn shopbtn" id="shopBtn" type="button" aria-label="Einkaufsmodus" aria-pressed="false" title="Einkaufsmodus">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.5l2.2 10.5a1.5 1.5 0 0 0 1.5 1.2h8.3a1.5 1.5 0 0 0 1.5-1.1L21 8H6.3"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>
      </button>
      <button class="iconbtn" id="menuBtn" type="button" aria-label="Menü öffnen" title="Menü">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
    <div class="sub">
      <button class="store shopsbtn" id="shopsChip" type="button" aria-label="Läden dieser Liste" hidden><svg class="si" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v10h16V10M3 10l2-6h14l2 6M3 10h18M9 20v-5h6v5"/></svg><span class="lbl">Läden</span><b id="shopsTxt"></b><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="store shopsbtn" id="storeChip" type="button" aria-label="Markt wählen"><svg class="si" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v10h16V10M3 10l2-6h14l2 6M3 10h18M9 20v-5h6v5"/></svg><span class="lbl">Markt</span><b id="storeTxt"></b><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="progress"><span id="progText">0 von 0</span><div class="bar"><i id="progBar"></i></div></div>
    </div>
    <div class="shopbar" id="shopBar" role="status"><span>Einkaufsmodus</span><button type="button" id="shopEnd">Beenden</button></div>
    <div class="sumline" id="sumLine" hidden></div>
    <div class="updbar" id="updBar" role="status" hidden>
      <span>Eine neue Version ist da.</span>
      <span class="updbtns"><button class="btn tag" type="button" id="updBtn">Aktualisieren</button><button class="updx" type="button" id="updLater" aria-label="Später aktualisieren" title="Später">✕</button></span>
    </div>
  </header>

  <form class="add" id="addForm" autocomplete="off" role="search">
    <div class="inwrap">
      <svg class="lupe" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>

function enForms(t){ const f = [t, enSingular(t)]; if (t.length > 4 && t.endsWith("ies")) f.push(t.slice(0, -1)); return f; }   // cookies → cooky / cookie
function enSingular(t){
  if (t.length > 4 && t.endsWith("ies")) return t.slice(0, -3) + "y";
  if (t.length > 4 && /(oes|ches|shes|sses|xes)$/.test(t)) return t.slice(0, -2);
  if (t.length > 3 && t.endsWith("s") && !/(ss|us|is)$/.test(t)) return t.slice(0, -1);

/* Kategorie + Trefferwert (0 = unbekannt). Wird auch genutzt, um bei „Nach Läden“ den passenden Laden zu finden. */
function scoreCat(name, type, ignoreLearned){
  type = type || currentType();
  const n = name.toLowerCase().trim();
  const f = ignoreLearned ? null : state.freq[n];
  if (f && f.cats && f.cats[type] && CATS[f.cats[type]]) return [f.cats[type], 1000];   // so hast du es in dieser Markt-Art einsortiert
  if (f && f.cat && CATS[f.cat] && (CATS[f.cat].t === type)) return [f.cat, 900];
  if (type === "lm" && (EN ? /(^|[\s-])(frozen)([\s-]|$)/ : /(^|[\s-])(tk|tiefkühl\S*|gefroren\S*)([\s-]|$)/).test(n)) return ["tk", 300];   // "TK Erbsen", "Tiefkühl-Himbeeren"
  // Wortgruppen wie "rote bete", "eis am stiel", "saure sahne"
  const spaced = " " + n.replace(/[-\/]+/g, " ") + " ";
  for (const [ph,c] of PHRASEMAPS[type] || []) if (spaced.includes(" " + ph + " ")) return [c, 200 + ph.length];
  const toks = n.split(/[\s\-\/]+/).filter(Boolean);
  let best = null, score = 0;
  if (EN){
    // Englisch: Mehrzahl/Einzahl, und das letzte Wort entscheidet ("orange juice" → Saft)
    const sp = " " + toks.map(enSingular).join(" ") + " ";
    for (const [ph,c] of PHRASEMAPS[type] || []) if (sp.includes(" " + ph + " ")) return [c, 200 + ph.length];
    toks.forEach((t, ix)=>{
      const forms = enForms(t);
      for (const [w,c] of KWMAPS[type] || KWMAPS.lm){
        let s = 0;
        if (forms.includes(w)) s = 100 + w.length + (ix === toks.length - 1 ? 30 : 0);
        else if (w.length >= 4 && forms.some(f=>f.endsWith(w))) s = 20 + w.length;
        if (s > score){ score = s; best = c; }
      }
    });
    return [best, score];
  }
  for (const t of toks) for (const [w,c] of KWMAPS[type] || KWMAPS.lm){
    let s = 0;
    if (t === w) s = 100 + w.length;                                   // genau das Wort
    else if (w.length >= 3 && t.endsWith(w)) s = 20 + w.length;        // Zusammensetzung: hinten entscheidet ("Erdbeer|marmelade")
    else if (w.length >= 5 && t.startsWith(w)) s = w.length - 1;       // vorne ("Tomaten|…") zählt weniger
    if (s > score){ score = s; best = c; }
  }
  return [best, score];
}

function normUnit(u){

const RE_PRICE = /(?:^|\s)(?:[$£€]\s?(\d+(?:[.,]\d{1,2})?)|(\d+(?:[.,]\d{1,2})?)\s*(?:€|\$|£|eur\b|euro\b|usd\b|gbp\b))/i;

function packs(qty){
  const q = splitQty(qty);
  if (q.count) return toNum(q.count) || 1;
  if (q.amount && q.unit && !MEASURE.has(q.unit.toLowerCase())) return toNum(q.amount) || 1;

/* Preise: in den Einstellungen an- und ausschaltbar, standardmäßig aus. Eingegebene Preise bleiben gespeichert, werden aber nur bei „an“ gezeigt. */
let showPrices = false, showIcons = true;   // wird nach dem Laden des Speichers gesetzt (siehe unten)
function lineTotal(i){ return (showPrices && typeof i.price === "number" && i.price > 0) ? i.price * packs(i.qty) : 0; }
function parseCore(raw){
  const s = normWords(String(raw).replace(/^[\s•\-*–]+|[\s.!]+$/g,""));

  if ((m = s.match(RE_LEAD_FULL)))  return {name:cap(m[4]), qty:formatQty(m[1], m[2], normUnit(m[3]))};
  if ((m = s.match(RE_TRAIL_FULL))) return {name:cap(m[1]), qty:formatQty(m[2], m[3], normUnit(m[4]))};
  if ((m = s.match(RE_LEAD))){
    const unit = normUnit(m[2]);
    return {name:cap(m[3]), qty: unit ? formatQty("", m[1], unit) : formatQty(m[1], "", "")};
  }
  if ((m = s.match(RE_LEAD_X)))     return {name:cap(m[2]), qty:formatQty(m[1], "", "")};

/* ---------- Zustand & Speicher ---------- */
const state = { items:{}, stores:{}, freq:{}, freqExists:false };
const db = null; // Diese Version speichert nur auf dem Gerät (localStorage)
const LS = "ezettel.v1";
function lsGet(k,d){ try{ const v = localStorage.getItem(LS+"."+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }

showPrices = lsGet("prices", false) === true;
showIcons = lsGet("icons", true) !== false;

let storeId = lsGet("store","standard");

/* ---------- Mehrere Listen ----------
   Jede Liste hat eigene Artikel und merkt sich ihren Markt. Die erste Liste ("main")
   nutzt den alten Speicherplatz "items", damit bestehende Listen erhalten bleiben. */
let lists = lsGet("lists", null);

/* Ansicht einer Liste: "cat" = mit Kategorien (ein Markt), "multi" = nach Läden, "simple" = einfach untereinander */
function viewOf(l){ l = l || curList(); return l.view || (l.simple ? "simple" : "cat"); }

if (curList().store) storeId = curList().store;

const queues = new Map();
function queued(key, fn){
  const prev = queues.get(key) || Promise.resolve();
  const next = prev.catch(()=>{}).then(fn);
  queues.set(key, next);
  return next.catch(e => { toast(e && e.code==="quota_exceeded" ? "Speicher voll: bitte erledigte Artikel entfernen." : "Konnte nicht speichern. Bitte nochmal versuchen."); });
}
function newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

const api = {
  setItem(id, data){
    if (db) return queued("i/"+id, ()=>db.doc("items/"+id).set(data));
    state.items[id] = data; persistLocal(); render();
  },
  updateItem(id, patch){
    if (db) return queued("i/"+id, ()=>db.doc("items/"+id).update(patch));
    if (state.items[id]) Object.assign(state.items[id], patch); persistLocal(); render();
  },
  removeItem(id){
    if (db) return queued("i/"+id, ()=>db.doc("items/"+id).delete());
    delete state.items[id]; persistLocal(); render();
  },
  saveStore(id, data){
    if (db) return queued("s/"+id, ()=>db.doc("stores/"+id).set(data));
    state.stores[id] = data; persistLocal(); render();
  },
  removeStore(id){
    if (db) return queued("s/"+id, ()=>db.doc("stores/"+id).delete());
    delete state.stores[id]; persistLocal(); render();
  },
  learn(entries){ // [{name,cat}]
    const patch = {};
    for (const e of entries){
      const k = e.name.toLowerCase().trim(); if (!k) continue;
      const old = state.freq[k] || {n:0};
      patch[k] = Object.assign({}, old, {n:(old.n||0)+(e.count?1:0), cat:e.cat || old.cat, name:e.name});
      if (e.cat && CATS[e.cat] && CATS[e.cat].t !== "*") patch[k].cats = Object.assign({}, old.cats || {}, {[CATS[e.cat].t]: e.cat});
      if (e.cat === "sonst" && e.explicit) patch[k].cats = Object.assign({}, old.cats || {}, {[e.type || currentType()]: "sonst"});   // bewusst „Sonstiges“

    Object.assign(state.freq, patch); persistLocal(); render();
  }
};

/* ---------- Märkte ---------- */
function storeList(){
  const list = BUILTIN.map(b => {
    const o = state.stores[b.id];
    return {id:b.id, name:b.name, type:b.type, order:fixOrder(o && o.order ? o.order : b.order, b.type), builtin:true, edited:!!o, region:b.region};
  });
  for (const id in state.stores){
    const s = state.stores[id];
    if (s && s.custom){ const ty = TYPES[s.type] ? s.type : "lm"; list.push({id, name:s.name||"Mein Markt", type:ty, order:fixOrder(s.order, ty), builtin:false}); }
  }

}
const SPLIT = {grund:["nudeln","backen","gewuerz"], kuehl:["feinkost"], suess:["knabber"], getraenke:["alkohol"], konserven:["international"], haushalt:["nonfood"]};
function fixOrder(o, type){
  const ok = c=>CATS[c] && (CATS[c].t === type || c === "sonst");
  const out = [];
  for (const c of (o||[])){
    if (ok(c) && !out.includes(c)) out.push(c);
    for (const e of SPLIT[c] || []) if (ok(e) && !out.includes(e) && !(o||[]).includes(e)) out.push(e);   // aufgeteilte Kategorien
  }
  for (const c of catsOf(type).concat("sonst")) if (!out.includes(c)) out.push(c);
  return out;
}
function storeById(id){ return storeList().find(s=>s.id===id) || null; }
/* Läden einer Liste „Nach Läden“:
   - selbst gewählte Läden (z. B. Rewe, OBI) in deiner Reihenfolge
   - dazu automatisch je Markt-Art ein allgemeiner Laden („Supermarkt“, „Baumarkt“ …), solange du für diese Art keinen gewählt hast.
   So landen „20 Eier“ und „Hammer“ ohne Einstellen bei Supermarkt und Baumarkt. */
const AUTO_TYPES = ["lm","drog","bau","getr","apo","tierb","moebel","elek","garten"];
const AUTO_STD = {lm:"standard", drog:"drog_std", bau:"bau_std", getr:"getr_std", apo:"apo_std", tierb:"tier_std", moebel:"moebel_std", elek:"elek_std", garten:"garten_std"};
const TYPE_ONE = EN ? EN.typeOne : {lm:"Supermarkt", drog:"Drogerie", bau:"Baumarkt", getr:"Getränkemarkt", apo:"Apotheke", tierb:"Tierbedarf", moebel:"Möbelhaus", elek:"Elektronikmarkt", rest:"Restposten", intl:"Asia-Markt", garten:"Gartencenter", wmarkt:"Wochenmarkt"};
function routeShops(){ const c = chosenShops(), u = usedShops(); const out = c.concat(u.filter(s=>!c.some(x=>x.id === s.id))); return out.length ? out : [listShops()[0]]; }
function chosenShops(l){ l = l || curList(); return (l.shops || []).map(storeById).filter(Boolean); }
function listShops(l){
  l = l || curList();
  const chosen = chosenShops(l);
  if (viewOf(l) !== "multi") return chosen.length ? chosen : [currentStore()];
  const have = new Set(chosen.map(s=>s.type));
  const autos = AUTO_TYPES.filter(t=>!have.has(t)).map(t=>{ const b = storeById(AUTO_STD[t]); return b && Object.assign({}, b, {name:TYPE_ONE[t], auto:true}); }).filter(Boolean);
  return chosen.concat(autos);
}
/* Läden, in denen gerade etwas offen ist (für Kopfzeile und Übersichten) */
function usedShops(l){
  l = l || curList();
  const its = Object.values(l.id === listId ? state.items : lsGet(itemsKey(l.id), {})).filter(i=>!i.done);
  const shops = listShops(l), used = new Set(its.map(i=>shopFor(i, shops).id));
  return shops.filter(s=>used.has(s.id));
}
function shortShops(l){ const p = shopsText(l).split(" · "); return p.length > 3 ? p.slice(0, 3).join(", ") + ` +${p.length - 3}` : p.join(", "); }
function shopsText(l){
  l = l || curList();
  const u = usedShops(l);
  if (u.length) return u.map(x=>x.name).join(" · ");
  const c = chosenShops(l);
  return c.length ? c.map(x=>x.name).join(" · ") + " · automatisch" : "automatisch";
}
/* Welcher Laden passt zu einem Artikel? Eigene Wahl > gemerkte Wahl > Erkennung.
   Bei Gleichstand gewinnt der Fachmarkt (Shampoo → Drogerie statt Supermarkt-Regal „Drogerie“). */
/* Nebensortimente: Gibt es einen Laden, der darauf spezialisiert ist, gewinnt der (Katzenfutter → Fressnapf statt dm) */
const SIDE = new Set(["drogerie","haushalt","baby","tier","nonfood","getraenke","alkohol","international",   // Supermarkt
  "d_tier","d_food","d_foto", "b_garten","b_haushalt", "gc_tier", "m_food","m_pflanzen","m_licht","m_kochen", "g_zub", "i_getr"]);
const TYPE_BIAS = {rest:-4, wmarkt:1};
function shopFor(i, stores){
  stores = stores || listShops();
  if (stores.length === 1) return stores[0];
  if (i.shop){ const s = stores.find(x=>x.id === i.shop); if (s) return s; }
  const f = state.freq[i.name.toLowerCase()];
  if (f && f.shop){ const s = stores.find(x=>x.id === f.shop) || stores.find(x=>x.type === f.shopType); if (s) return s; }
  // Ohne Treffer: in den Supermarkt (falls dabei), sonst in den ersten Laden
  let best = stores.find(s=>s.type === "lm") || stores[0], bestV = 0;
  // Automatische Fachmärkte nur für Dinge, die es im Supermarkt nicht gibt (Hammer → Baumarkt, Shampoo bleibt im Supermarkt).
  // Selbst gewählte Läden (z. B. dm) bekommen dagegen alles aus ihrem Sortiment.
  const lmKnows = stores.some(s=>s.auto && s.type !== "lm") ? scoreCat(i.name, "lm", true)[1] > 0 : false;
  for (const s of stores){
    if (s.auto && s.type !== "lm" && lmKnows) continue;
    const [c, sc] = scoreCat(i.name, s.type, true);      // Ladenwahl nach Wortschatz; gemerkte Kategorien zählen hier nicht
    if (!sc) continue;
    const v = sc + (TYPE_BIAS[s.type] || 0) - (SIDE.has(c) ? 5 : 0) - (s.auto ? 1 : 0);   // bei Gleichstand gewinnt der selbst gewählte Laden
    if (v > bestV){ bestV = v; best = s; }
  }
  return best;
}

    $("pkMore").textContent = moreNames ? "Weniger anzeigen ▴" : `Weitere anzeigen (${extra.length}) ▾`;
  };
  drawTypes(); drawNames();
  document.querySelector(".sheet").addEventListener("click", e=>{
    const t = e.target.closest("[data-ptype]"), p = e.target.closest("[data-pick]");
    if (p){ opt.onPick && opt.onPick(p.dataset.pick); return; }

    if (e.target.closest("#pkMoreTypes")){ moreTypes = !moreTypes; drawTypes(); return; }
    if (e.target.closest("#pkMore")){ moreNames = !moreNames; drawNames(); }
  });
}

/* Laufweg aus der Abhak-Reihenfolge lernen:
   Die Gänge, in denen heute etwas abgehakt wurde, bekommen die Reihenfolge,
   in der du sie tatsächlich besucht hast. Alle anderen Gänge bleiben an ihrem Platz. */
function learnedOrder(st){
  const done = Object.values(state.items).filter(i=>i.done && i.dt>0).sort((a,b)=>a.dt-b.dt);
  const seen = [];
  for (const i of done){ const c = catIn(i, st); if (!seen.includes(c)) seen.push(c); }
  if (seen.length < 2) return null;
  const slots = seen.map(c=>st.order.indexOf(c)).sort((a,b)=>a-b);
  const next = st.order.slice();
  slots.forEach((slot,ix)=>{ next[slot] = seen[ix]; });
  return next.join() === st.order.join() ? null : next;
}
function saveOrder(st, order){
  if (st.builtin) return api.saveStore(st.id, {order});
  return api.saveStore(st.id, {custom:true, name:st.name, type:st.type, order});
}

/* ---------- Mengen zusammenzählen ----------
   Kommt ein Artikel nochmal dazu, wird die Menge erhöht statt doppelt eingetragen:
   Milch + Milch = 2 · 2 Milch + 3 Milch = 5 · 500 g Hack + 250 g Hack = 750 g
   2 Dosen + Dosen = 3 Dosen · 500 g Hack + Hack = 2 × 500 g · 2 × 500 g + Hack = 3 × 500 g */
const MEASURE = new Set(["g","kg","ml","l","oz","lb","fl oz","gal","pt","qt"]);
function toNum(x){ const n = parseFloat(String(x).replace(",", ".")); return isFinite(n) ? n : null; }
function fmtNum(n){ return String(Math.round(n*1000)/1000).replace(".", DEC); }
function mergeQty(oldQ, addQ){
  const o = splitQty(oldQ), a = splitQty(addQ);
  const oEmpty = !String(oldQ||"").trim(), aEmpty = !String(addQ||"").trim();
  const isCount = q => q.count && !q.amount && !q.unit;     // "3"
  const oCnt = oEmpty ? 1 : (isCount(o) ? toNum(o.count) : null);
  const aCnt = aEmpty ? 1 : (isCount(a) ? toNum(a.count) : null);
  // nur Stückzahlen (oder gar keine Angabe): addieren
  if (oCnt !== null && aCnt !== null) return fmtNum(oCnt + aCnt);
  // bisher ohne Angabe, jetzt mit Gewicht/Einheit: die neue Angabe übernehmen
  if (oEmpty) return addQ;
  const oUnit = (o.unit||"").toLowerCase(), aUnit = (a.unit||"").toLowerCase();
  // gleiche Packung ("500 g") nochmal: Anzahl hochzählen → "2 × 500 g"
  const samePack = !aEmpty && o.amount && a.amount && toNum(o.amount) === toNum(a.amount) && oUnit === aUnit;
  if (aEmpty || samePack){
    const add = aEmpty ? 1 : (toNum(a.count) || 1);
    if (o.count && o.amount) return formatQty(fmtNum((toNum(o.count)||1) + add), o.amount, o.unit);      // 2 × 500 g → 3 × 500 g
    if (o.amount && o.unit && !MEASURE.has(oUnit)) return formatQty("", fmtNum(toNum(o.amount) + add), o.unit); // 2 Dosen → 3 Dosen
    if (o.amount) return formatQty(fmtNum(1 + add), o.amount, o.unit);                                       // 500 g → 2 × 500 g
  }
  // gleiche Einheit, verschiedene Mengen: zusammenrechnen ("500 g" + "250 g" = "750 g", "2 Dosen" + "3 Dosen")
  if (o.amount && a.amount && !o.count && !a.count && oUnit === aUnit) return formatQty("", fmtNum(toNum(o.amount) + toNum(a.amount)), o.unit);
  // passt nicht zusammen (z. B. 1 l und 6 Flaschen): neue Angabe gilt
  return addQ;
}

/* ---------- Aktionen ---------- */
/* ---------- Artikel trennen, auch ohne Komma ----------
   "Milch 1 liter wasser 15 eier" → Milch | 1 liter wasser | 15 eier
   "Kaffee 1 kg Zucker eine Gurke" → Kaffee | 1 kg Zucker | eine Gurke
   "Eier 10" / "Hack 2 x 500 g" bleiben ein Artikel (Menge steht am Ende)
   "Milch Brot Butter" → drei Artikel, wenn jedes Wort ein bekanntes Produkt ist */
const KWSET = new Set(KWMAP.map(([w])=>w));
const RE_NUMTOK  = /^(\d+(?:[.,]\d+)?[x×]?|[x×]\d+|½|\d+(?:[.,]\d+)?(?:g|gr|kg|ml|l)\.?)$/i;
function isNumTok(w){ return RE_NUMTOK.test(w) || !!NUMW[w.toLowerCase()]; }
function isQtyTok(w){ return isNumTok(w) || isPriceTok(w) || UNIT_WORD.test(w) || ARTICLES.has(w.toLowerCase()) || /^[x×]$/i.test(w); }
function segmentByQuantity(part){
  const raw = part.trim().split(/\s+/).filter(Boolean);
  // "1,29 €" → ein Token "1,29€", damit der Preis beim Artikel bleibt
  const w = [];
  for (const t of raw){
    if (/^(€|\$|£|eur|euro|usd|gbp)$/i.test(t) && w.length && /^\d+(?:[.,]\d{1,2})?$/.test(w[w.length-1])) w[w.length-1] += "€";
    else w.push(t);
  }
  const segs = []; let cur = []; let afterPrice = false;
  const hasName = arr => arr.some(t=>!isQtyTok(t));
  for (let i = 0; i < w.length; i++){
    const t = w[i];
    if (isPriceTok(t)){ cur.push(t); afterPrice = true; continue; }   // Preis gehört zum Artikel davor …
    if (afterPrice && hasName(cur)){ segs.push(cur.join(" ")); cur = []; }   // … und schließt ihn ab
    afterPrice = false;
    const startsQty = isNumTok(t) || ARTICLES.has(t.toLowerCase());
    if (startsQty && hasName(cur)){
      // nur trennen, wenn nach der Mengenangabe noch ein Name folgt
      let j = i; while (j < w.length && isQtyTok(w[j])) j++;
      if (j < w.length){ segs.push(cur.join(" ")); cur = []; }
    }
    cur.push(t);
  }
  if (cur.length) segs.push(cur.join(" "));
  return segs;
}
/* Englisch: Diese Wörter stehen fast nie allein, sondern hinter einem anderen ("orange juice", "cat food") */

function splitKnownWords(seg){
  const w = seg.trim().split(/\s+/);
  // Mengenangabe vorne abtrennen: "3 Brötchen Butter" → Menge "3", Namen "Brötchen Butter"
  let q = 0; while (q < w.length && isQtyTok(w[q])) q++;
  const names = w.slice(q);
  if (names.length < 2 || names.some(x=>/\d/.test(x))) return [seg];
  if (state.freq[names.join(" ").toLowerCase()]) return [seg];   // so schon mal eingetragen → zusammenlassen
  if (ALL_PHRASES.has(names.join(" ").toLowerCase())) return [seg];                   // "Wiener Würstchen", "Tortilla Chips"
  const known = x => KWSET.has(x.toLowerCase()) || !!state.freq[x.toLowerCase()];
  // Zusätze an das folgende Wort hängen, Wortgruppen zusammenhalten
  const merged = [];
  for (let i = 0; i < names.length; i++){
    const two = i + 1 < names.length ? (names[i] + " " + names[i+1]).toLowerCase() : "";
    if (EN && i + 2 < names.length && ALL_PHRASES.has((two + " " + names[i+2]).toLowerCase())){ merged.push(names.slice(i, i + 3).join(" ")); i += 2; continue; }
    if (EN && two && ALL_PHRASES.has(two)){ merged.push(names[i] + " " + names[i+1]); i++; continue; }   // "apple juice milk" → "apple juice", "milk"
    if (two && ALL_PHRASES.has(two)) return [seg];                      // enthält eine Wortgruppe ("Sweet Chili Sauce") → nicht trennen
    if (two && (MODIFIERS.has(names[i].toLowerCase()) || (EN && (EN_HEADS.has(names[i+1].toLowerCase()) || EN_MODNOUNS.has(names[i].toLowerCase()))))){ merged.push(names[i] + " " + names[i+1]); i++; }
    else merged.push(names[i]);
  }
  if (merged.length < 2) return [seg];
  if (!merged.every(m=>known(m.split(" ").pop()))) return [seg];
  // die Menge gehört zum ersten Produkt, die anderen kommen ohne Menge dazu
  return [w.slice(0, q).concat(merged[0]).join(" "), ...merged.slice(1)];
}
function splitItems(text){
  return String(text)
    .split(EN ? /,(?!\d)|[;\n]|\s+and\s+|\s+&\s+/i : /,(?!\d)|[;\n]|\s+und\s+|\s+&\s+/i)              // Komma (nicht in "1,5 l"), Semikolon, Zeile, "und", "&"
    .flatMap(segmentByQuantity)
    .flatMap(splitKnownWords)
    .map(x=>x.trim()).filter(Boolean);
}

/* Ein Artikel kommt auf die aktuelle Liste: steht er schon drauf, wird die Menge erhöht.
   p = {name, qty, note?, cat?, price?}. Gibt eine Meldung zurück, wenn zusammengezählt wurde. */
function addEntry(p, t, learn){
  const existing = Object.entries(state.items).find(([id,v])=>!v.done && v.name.toLowerCase()===p.name.toLowerCase());
  const known = state.freq[p.name.toLowerCase()] || {};
  if (existing){
    const [id, v] = existing;
    const patch = {qty: mergeQty(v.qty, p.qty)};
    if (typeof p.price === "number") patch.price = p.price;
    if (p.note && !v.note) patch.note = p.note;
    api.updateItem(id, patch);
    learn.push({name:v.name, cat:v.cat, count:true, price:p.price});   // zählt für „Oft gekauft“ mit
    return `${v.name}: jetzt ${patch.qty}`;
  }
  const cat = p.cat && CATS[p.cat] && (p.cat === "sonst" || CATS[p.cat].t === currentType()) ? p.cat : guessCat(p.name);
  const item = {name:p.name, qty:p.qty || "", cat, done:false, t};
  if (p.note) item.note = p.note;
  const price = typeof p.price === "number" ? p.price : (typeof known.price === "number" ? known.price : null);  // gemerkter Preis
  if (price != null) item.price = price;
  api.setItem(newId(), item);
  learn.push({name:p.name, cat, count:true, price:p.price});
  return "";
}
function addEntries(list){
  const now = Date.now(); const learn = []; const msgs = [];
  list.forEach((p,ix)=>{ const m = addEntry(p, now+ix, learn); if (m) msgs.push(m); });
  if (learn.length) api.learn(learn);
  return msgs;
}
function addFromText(text){
  const parts = splitItems(text).map(parse).filter(p=>p && p.name);
  if (!parts.length) return;
  const msgs = addEntries(parts);
  if (msgs.length) toast(msgs.join(" · ") + ".");
}

/* Suchfeld: zeigt beim Tippen bekannte Artikel (früher eingetragen oder gescannt).
   Gesucht wird mit dem letzten Wort bzw. Teil nach einem Komma. Antippen übernimmt den Vorschlag. */
function suggQuery(){
  const v = $("addInput").value;
  const last = v.split(/,(?!\d)|;/).pop();
  const words = last.trim().split(/\s+/);
  let q = 0; while (q < words.length - 1 && isQtyTok(words[q])) q++;     // "2 Mi" → "Mi"
  return {v, last, query: words.slice(q).join(" ").toLowerCase(), qty: words.slice(0, q).join(" ")};
}
function showSugg(){
  const box = $("sugg");
  const {query} = suggQuery();
  if (query.length < 2){ box.hidden = true; box.innerHTML = ""; return; }
  const onList = new Set(Object.values(state.items).filter(i=>!i.done).map(i=>i.name.toLowerCase()));
  const known = new Map();
  for (const [k,v] of Object.entries(state.freq)) known.set(k, {name: v.name || cap(k), n: v.n || 0});
  for (const c of Object.values(state.codes || {})) if (c && c.name && !known.has(c.name.toLowerCase())) known.set(c.name.toLowerCase(), {name:c.name, n:0});
  const hits = [...known.entries()]
    .filter(([k])=>k.includes(query) && k !== query)
    .map(([k,v])=>({k, ...v, score: (k.startsWith(query) ? 1000 : 0) + v.n}))
    .sort((a,b)=>b.score - a.score).slice(0, 8);
  const dishHits = (state.dishes || []).filter(d=>d.name.toLowerCase().includes(query)).slice(0, 3);
  box.hidden = !hits.length && !dishHits.length;
  box.innerHTML = dishHits.map(d=>`<button class="chip dishchip" type="button" data-sdish="${esc(d.id)}"><svg viewBox="0 0 24 24" aria-hidden="true">${d.tpl ? ICONS.tpl : ICONS.dish}</svg><span translate="no">${esc(d.name)}</span><small>${d.tpl ? "Vorlage" : "Gericht"}</small></button>`).join("")
    + hits.map(h=>`<button class="chip" type="button" data-sugg="${esc(h.name)}"><b>+</b><span translate="no">${esc(h.name)}</span>${onList.has(h.k) ? "<small>schon drauf</small>" : ""}</button>`).join("");
}

/* ---------- Wischen: nach rechts = abhaken, nach links = löschen ---------- */
let swipe = null, swipeJustEnded = false;
const SWIPE_GO = 90;
$("list").addEventListener("pointerdown", e=>{
  const row = e.target.closest(".rowin");
  if (!row || e.target.closest(".more") || (e.pointerType === "mouse" && e.button !== 0)) return;
  swipe = {row, li: row.closest("li"), id: row.closest("li").dataset.id, x: e.clientX, y: e.clientY, pid: e.pointerId, active:false, dx:0};
});
window.addEventListener("pointermove", e=>{
  if (!swipe || e.pointerId !== swipe.pid) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (!swipe.active){
    if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)){ swipe = null; return; }  // senkrecht = scrollen
    if (Math.abs(dx) < 12 || Math.abs(dx) < Math.abs(dy) * 1.3) return;
    swipe.active = true;
    try{ swipe.row.setPointerCapture(e.pointerId); }catch(_){}
  }
  e.preventDefault();
  swipe.dx = dx;
  const shown = Math.sign(dx) * Math.min(Math.abs(dx), 160 + (Math.abs(dx) - 160) * 0.3 * (Math.abs(dx) > 160));
  swipe.row.style.transform = `translateX(${shown}px)`;
  swipe.li.classList.toggle("sw-right", dx > 0);
  swipe.li.classList.toggle("sw-left", dx < 0);
  swipe.li.classList.toggle("sw-go", Math.abs(dx) >= SWIPE_GO);
}, {passive:false});
function endSwipe(e){
  if (!swipe || (e && e.pointerId !== swipe.pid)) return;
  const s = swipe; swipe = null;
  if (!s.active) return;
  swipeJustEnded = true; setTimeout(()=>{ swipeJustEnded = false; }, 60);
  if (s.dx >= SWIPE_GO){ toggleItem(s.id); return; }
  if (s.dx <= -SWIPE_GO){
    s.row.classList.add("snap"); s.row.style.transform = "translateX(-110%)";
    setTimeout(()=>deleteItem(s.id), 160);
    return;
  }
  s.row.classList.add("snap"); s.row.style.transform = "";
  setTimeout(()=>{ s.row.classList.remove("snap"); s.li.classList.remove("sw-right","sw-left","sw-go"); }, 220);
}
window.addEventListener("pointerup", endSwipe);
window.addEventListener("pointercancel", endSwipe);

const EXPORT_HEAD = EN ? "🛒 Shopping list" : "🛒 Einkaufsliste";
function buildExport(){
  const st = currentStore();
  const open = Object.values(state.items).filter(i=>!i.done);
  const d = new Date();
  const line = i=>`• ${i.qty?i.qty+" ":""}${i.name}${showPrices && typeof i.price === "number" ? " " + fmtPrice(i.price) : ""}${i.note?" ("+i.note+")":""}`;
  if (viewOf() === "simple"){
    const out = `${EXPORT_HEAD} (${curList().name}) · ${d.toLocaleDateString(LOCALE)}\n\n` + open.sort((a,b)=>(a.t||0)-(b.t||0)).map(line).join("\n");
    return {text:out.trim(), count:open.length};
  }
  if (viewOf() === "multi"){
    const shops = listShops();
    let out = `${EXPORT_HEAD} (${curList().name}) · ${d.toLocaleDateString(LOCALE)}\n`;
    for (const sh of shops){
      const its = open.filter(i=>shopFor(i, shops).id === sh.id); if (!its.length) continue;
      out += `\n🏪 ${sh.name}\n`;
      for (const c of sh.order){
        const g = its.filter(i=>catIn(i, sh)===c).sort((a,b)=>(a.t||0)-(b.t||0));
        if (g.length) out += `\n${CATS[c].l}\n` + g.map(line).join("\n") + "\n";
      }
    }
    return {text:out.trim(), count:open.length};
  }
  let out = `${EXPORT_HEAD} (${st.name}) · ${d.toLocaleDateString(LOCALE)}\n`;
  for (const c of st.order){
    const g = open.filter(i=>catIn(i, st)===c).sort((a,b)=>(a.t||0)-(b.t||0));
    if (!g.length) continue;
    out += `\n${CATS[c].l}\n` + g.map(i=>`• ${i.qty?i.qty+" ":""}${i.name}${showPrices && typeof i.price === "number" ? " " + fmtPrice(i.price) : ""}${i.note?" ("+i.note+")":""}`).join("\n") + "\n";
  }
  return {text:out.trim(), count:open.length};
}

/* Dateiformat: Einkaufsliste-JJJJ-MM-TT.txt
   Lesbarer Text (Gänge als Überschriften, Artikel mit •), den die App beim Einfügen
   wieder vollständig einliest: Menge, Notiz in Klammern und Kategorie bleiben erhalten.
   .txt statt .json, weil Android nur bestimmte Dateitypen über das Teilen-Menü erlaubt
   und weil jeder die Datei auch ohne App lesen kann. */
const FILE_APP = "einkaufszettel";
function fileName(){
  const d = new Date(); const p = n=>String(n).padStart(2,"0");
  return `${EN ? "Shopping-list" : "Einkaufsliste"}-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.txt`;
}

/* Erkennt exportierte Listen und auch frei getippte Nachrichten wie "Milch, Eier und 2 Gurken" */
const CAT_BY_LABEL = {"nudeln, reis & backzutaten":null, "süßes & snacks":null};   // ältere, gröbere Überschriften: Artikel neu einsortieren
for (const c in CATS){ CAT_BY_LABEL[CATS[c].l.toLowerCase()] = c; CAT_BY_LABEL[DE_CAT_LABELS[c].toLowerCase()] = c; }
if (window.I18N_EN) for (const c in window.I18N_EN.cats) if (CATS[c]) CAT_BY_LABEL[window.I18N_EN.cats[c].toLowerCase()] = c;   // Listen aus der jeweils anderen Sprache verstehen
function parseImport(text){
  const out = []; const seen = new Set();
  let cat = null, shopId = null;
  for (let line of String(text).split(/\r?\n/)){
    line = line.replace(/^\[\d{1,2}[.\/]\d{1,2}[.\/]\d{2,4},? \d{1,2}:\d{2}(?::\d{2})?\] [^:]{1,40}: /, ""); // WhatsApp-Zeitstempel beim Kopieren mehrerer Nachrichten
    line = line.trim();
    if (!line) continue;
    if (line.startsWith("🏪")){ const nm = line.replace(/^🏪\s*/, "").toLowerCase(); const found = storeList().find(x=>x.name.toLowerCase() === nm); const ty = Object.keys(TYPE_ONE).find(t=>TYPE_ONE[t].toLowerCase() === nm); shopId = found ? found.id : (ty && AUTO_STD[ty]) || null; cat = null; continue; }
    if (line.startsWith("🛒") || /^(einkauf(szettel|sliste)?|laufzettel|korbvoll|shopping list|grocery list)\b/i.test(line)) continue;
    const asLabel = line.replace(/[:*_]/g,"").trim().toLowerCase();
    if (asLabel in CAT_BY_LABEL){ cat = CAT_BY_LABEL[asLabel]; continue; }
    const bullet = /^([•\-*–·▪◦]|☐|\[ ?\]|\d+[.)](?=\s))\s*/.test(line);
    line = line.replace(/^([•\-*–·▪◦]|☐|\[ ?\]|\d+[.)](?=\s))\s*/, "");
    const parts = bullet ? [line] : splitItems(line);
    for (let p of parts){
      p = p.trim().replace(/[.!]+$/,"");
      if (!p) continue;
      let note = "";
      const nm = p.match(/^(.*?)\s*\(([^)]{1,80})\)$/);
      if (nm){ p = nm[1]; note = nm[2].trim(); }
      const r = parse(p); if (!r || !r.name) continue;
      const key = r.name.toLowerCase();
      if (seen.has(key)) continue; seen.add(key);
      const o = {name:r.name, qty:r.qty, note, cat: cat || guessCat(r.name)};
      if (shopId) o.shop = shopId;
      if (typeof r.price === "number") o.price = r.price;
      out.push(o);
    }
    if (!bullet) cat = null;
  }
  return out;
}
/* Einfügen: neue Artikel kommen dazu. Bei Artikeln, die schon drauf stehen,
   wird die Menge erhöht (abwählbar), fehlende Notizen werden ergänzt. */
function planImport(list){
  const openByName = {};
  for (const [id,v] of Object.entries(state.items)) if (!v.done) openByName[v.name.toLowerCase()] = {id, v};
  const add = [], merge = [];
  for (const it of list){
    const ex = openByName[it.name.toLowerCase()];
    if (!ex) add.push(it);
    else merge.push({id:ex.id, it, ex:ex.v, newQty: mergeQty(ex.v.qty, it.qty), on:true});
  }
  return {add, merge};
}

function readFileList(text){
  let obj = null;
  try{ obj = JSON.parse(text); }catch(e){ obj = null; }
  if (obj && obj.app===FILE_APP && Array.isArray(obj.items)){
    const seen = new Set(); const out = [];
    for (const r of obj.items.slice(0,500)){
      if (!r || typeof r.name!=="string") continue;
      const name = cap(r.name.trim().slice(0,120)); if (!name) continue;
      const key = name.toLowerCase(); if (seen.has(key)) continue; seen.add(key);
      out.push({
        name,
        qty: typeof r.qty==="string" ? r.qty.trim().slice(0,40) : "",
        note: typeof r.note==="string" ? r.note.trim().slice(0,80) : "",
        cat: CATS[r.cat] ? r.cat : guessCat(name)
      });
    }
    return {list:out, from: typeof obj.store==="string" ? obj.store.slice(0,60) : ""};
  }
  if (obj) return null; // JSON, aber keine Einkaufsliste-Datei
  const m = String(text).match(/^\s*🛒[^(\n]*\(([^)\n]{1,60})\)/);
  return {list:parseImport(text), from: m ? m[1] : ""};
}

    <p class="note" id="imSrc"></p>
    <div id="imPrev" class="imprev" aria-live="polite"></div>
    <details class="alt"><summary>Stattdessen Text einfügen</summary>
      <textarea id="imText" class="ta" placeholder="Text aus WhatsApp hier einfügen" aria-label="Text zum Einfügen"></textarea>
    </details>
    <div class="row"><button class="btn" type="button" id="imGo" disabled>Hinzufügen</button><button class="btn ghost" type="button" data-close>Abbrechen</button></div>`);
  const ta = $("imText");
  let plan = null;
  $("imFile").addEventListener("change", e=>{
    const f = e.target.files && e.target.files[0]; if (!f) return;
    if (f.size > 1024*1024){ $("imSrc").textContent = "Die Datei ist zu groß für einen Einkaufsliste."; return; }
    const rd = new FileReader();
    rd.onload = ()=>handleText(String(rd.result||""), f.name);
    rd.onerror = ()=>{ $("imSrc").textContent = "Die Datei konnte nicht gelesen werden. Bitte nochmal auswählen."; };
    rd.readAsText(f);
  });
  function handleText(text, name){
    try{ const o = JSON.parse(text); if (o && o.app === BACKUP_APP){ openBackup({obj:o, name}); return; } }catch(_){}
    const res = readFileList(text);
    if (!res){ $("imSrc").textContent = `„${name}“ ist keine Einkaufsliste-Datei.`; showPlan([]); return; }
    $("imSrc").textContent = `„${name}“${res.from ? " · erstellt für " + res.from : ""}`;
    showPlan(res.list);
  }
  ta.addEventListener("input", ()=>showPlan(parseImport(ta.value), true));
  function updateGo(){
    const nAdd = plan ? plan.add.length : 0, nUp = plan ? plan.merge.filter(m=>m.on).length : 0;
    const go = $("imGo");
    go.disabled = !(nAdd + nUp);
    go.textContent = (nAdd + nUp) ? [nAdd ? `${nAdd} hinzufügen` : "", nUp ? `${nUp} erhöhen` : ""].filter(Boolean).join(", ") : "Hinzufügen";
  }
  function showPlan(list, fromText){
    plan = planImport(list);
    updateGo();
    if (!list.length){ $("imPrev").innerHTML = (!fromText || ta.value.trim()) ? `<p class="note">Darin wurden keine Artikel gefunden.</p>` : ""; return; }
    const label = it=>`${it.qty?`<b>${esc(it.qty)}</b> `:""}<span translate="no">${esc(it.name)}</span>${it.note?` <i>(${esc(it.note)})</i>`:""}`;
    const newRows = plan.add.map(it=>`<li><span>${label(it)}</span><em class="pill new">${esc(CATS[catIn(it)].l)}</em></li>`).join("");
    const mergeRows = plan.merge.map((m,ix)=>`<li class="mrow">
      <label class="mcheck"><input type="checkbox" data-mix="${ix}" checked>
        <span><span class="mname">${esc(m.ex.name)}</span><small>Steht schon drauf · Menge erhöhen: ${esc(m.ex.qty || "1")} → <b>${esc(m.newQty || "1")}</b></small></span>
      </label></li>`).join("");
    $("imPrev").innerHTML = `${plan.merge.length ? `<p class="note">${plan.merge.length === 1 ? "1 Artikel steht" : plan.merge.length + " Artikel stehen"} schon auf deiner Liste. Abgehakt wird die Menge erhöht, sonst bleibt er wie er ist.</p>` : ""}<ul>${newRows}${mergeRows}</ul>`;
    $("imPrev").querySelectorAll("[data-mix]").forEach(cb=>cb.addEventListener("change", ()=>{ plan.merge[+cb.dataset.mix].on = cb.checked; updateGo(); }));
  }
  $("imGo").onclick = ()=>{
    if (!plan) return;
    const now = Date.now();
    plan.add.forEach((it,ix)=>{ const o = {name:it.name, qty:it.qty, note:it.note, cat:it.cat, done:false, t:now+ix}; if (typeof it.price === "number") o.price = it.price; if (it.shop) o.shop = it.shop; api.setItem(newId(), o); });
    let up = 0;
    plan.merge.forEach(m=>{
      const patch = {};
      if (m.on && m.newQty !== (m.ex.qty || "")){ patch.qty = m.newQty; up++; }
      if (m.it.note && !m.ex.note) patch.note = m.it.note;
      if (typeof m.it.price === "number" && m.it.price !== m.ex.price) patch.price = m.it.price;
      if (Object.keys(patch).length) api.updateItem(m.id, patch);
    });
    if (plan.add.length) api.learn(plan.add.map(it=>({name:it.name, cat:it.cat, count:false})));
    const kept = plan.merge.filter(m=>!m.on).length;
    const msg = [plan.add.length ? `${plan.add.length} neu` : "", up ? `${up} Mengen erhöht` : "", kept ? `${kept} unverändert` : ""].filter(Boolean).join(", ");
    closeSheet(); toast(`Eingefügt: ${msg}.`);
  };
  if (preset) handleText(preset.text, preset.name);
}

}
async function toggleWake(){

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
/* "ich brauche zwei Kilo Kartoffeln und ein Liter Milch dann Brot" → "zwei kilo kartoffeln, ein liter milch, brot"
   Zahlwörter und Mengen erkennt danach parse() – genauso wie beim Tippen. */
function speechToList(t){
  let s = " " + String(t).toLowerCase().replace(/[.!?]/g," ") + " ";
  if (EN){
    s = s.replace(/\s(i need|we need|i want|please|also need|buy|get|to the list|on the list|add|put)(?=\s)/g, " ");
    s = s.replace(/\s(and|then|also|plus|as well as)(?=\s)/g, ",");
  } else {
    s = s.replace(/\s(ich brauche|wir brauchen|brauchen wir|bitte|noch|kaufen|auf die liste|schreib|schreibe)(?=\s)/g, " ");
    s = s.replace(/\s(und|dann|außerdem|sowie|plus)(?=\s)/g, ",");
  }
  return s.split(/,(?!\d)/).map(x=>x.trim()).filter(Boolean).join(", ");
}
if (SR){
  const mic = $("micBtn"); mic.hidden = false;

    rec = new SR();

    const before = inp.value; let finalText = ""; let failed = false;
    rec.onresult = e=>{
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++){

    catch(e){ rec = null; toast("Die Spracheingabe konnte nicht starten."); }
