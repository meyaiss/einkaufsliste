// Produktdaten: Open Food Facts (freie Datenbank, ohne Anmeldung). Gescannte Produkte merkt sich die App, auch offline.
state.codes = lsGet("codes", {});
const OFF_CAT = [
  [/baby/,"baby"], [/pet-food|dog-food|cat-food|petfood/,"tier"], [/frozen/,"tk"],
  [/beers|wines|spirits|alcoholic|liqueurs|ciders/,"alkohol"],
  [/beverages$|drinks|waters|juices|sodas|nectars/,"getraenke"],
  [/dairies|dairy|cheeses|yogurts|milks|eggs|butters|creams|quarks/,"kuehl"],
  [/tofu|hummus|fresh-pasta|meat-analogues|doughs/,"feinkost"],
  [/meats|sausages|hams|fishes|seafood|poultry|salami/,"fleisch"],
  [/breads|bakery|pastries|rolls/,"brot"],
  [/fruits|vegetables|salads/,"obst"],
  [/breakfast|cereals|mueslis|coffees|teas|spreads|jams|honeys|cocoa/,"fruehstueck"],
  [/pastas|rices|noodles|grains|couscous|legumes/,"nudeln"],
  [/flours|sugars|baking|yeasts/,"backen"],
  [/oils|vinegars|spices|salts|condiments-salt|broths|bouillon/,"gewuerz"],
  [/asian|mexican|soy-sauces|coconut-milks/,"international"],
  [/canned|sauces|soups|condiments|ketchup|mustards|pickles|meals/,"konserven"],
  [/crisps|chips|nuts|salty-snacks|crackers|popcorn/,"knabber"],
  [/sweets|chocolates|biscuits|candies|confectioner|cookies|snacks/,"suess"],
  [/hygiene|cosmetics|shampoo|toothpaste|soaps|deodorants/,"drogerie"],
  [/cleaning|household|detergents|dishwashing/,"haushalt"]
];
function catFromOff(tags){
  const list = Array.isArray(tags) ? tags.slice().reverse() : []; // die genaueste Kategorie steht hinten
  for (const t of list){
    if (/plant-based-foods-and-beverages|beverages-and-beverages-preparations/.test(t)) continue;
    for (const [re,c] of OFF_CAT) if (re.test(t)) return c;
  }
  return null;
}
function normQty(q){
  const s = String(q||"").trim().slice(0,30); if (!s) return "";
  const r = parse(s + " _");
  return r && r.name === "_" ? r.qty : "";
}
function loadScript(src){
  return new Promise((res,rej)=>{ const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = rej; document.head.appendChild(el); });
}
let detectorP = null;
function getDetector(){
  if (detectorP) return detectorP;
  detectorP = (async ()=>{
    const formats = ["ean_13","ean_8","upc_a","upc_e","qr_code"];
    if ("BarcodeDetector" in window){   // eingebaut: Chrome unter Android
      try{
        const sup = await window.BarcodeDetector.getSupportedFormats();
        const use = formats.filter(f=>sup.includes(f));
        if (use.length){
          const bd = new window.BarcodeDetector({formats:use});
          return async v=>{ const r = await bd.detect(v); return r && r[0] ? r[0].rawValue : null; };
        }
      }catch(e){}
    }
    await loadScript("vendor/zxing.min.js"); // Ersatz für iPhone & andere Browser
    const Z = window.ZXing;
    const reader = new Z.MultiFormatReader();
    const hints = new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.QR_CODE]);
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    reader.setHints(hints);
    const cv = document.createElement("canvas");
    const ctx = cv.getContext("2d", {willReadFrequently:true});
    return async v=>{
      const w = v.videoWidth, h = v.videoHeight; if (!w || !h) return null;
      const cw = Math.round(w*0.8), ch = Math.round(h*0.45); // nur der Bereich im Rahmen
      cv.width = cw; cv.height = ch;
      ctx.drawImage(v, (w-cw)/2, (h-ch)/2, cw, ch, 0, 0, cw, ch);
      try{ return reader.decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)))).getText(); }
      catch(e){ return null; }
    };
  })().catch(()=>{ detectorP = null; return null; });
  return detectorP;
}

let scan = null;
$("scanBtn").addEventListener("click", openScanner);
function openScanner(e){
  if (e && e.type === "click") joinScan = false;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast("Dieser Browser kann die Kamera nicht nutzen."); return; }
  openSheet(`<h3>${joinScan ? "QR-Code scannen" : "Barcode scannen"}</h3>
    <div class="scanbox"><video id="scVideo" playsinline muted autoplay></video><div class="frame"></div><div class="laser"></div></div>
    <p class="note" id="scStatus" aria-live="polite">Kamera wird gestartet …</p>
    <div id="scResult"></div>
    <div class="row"><button class="btn ghost" type="button" data-close>Fertig</button></div>`, stopScan);
  startScan();
}
async function startScan(){
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720}}});
  }catch(e){
    if ($("scStatus")) $("scStatus").textContent = e && e.name==="NotAllowedError"
      ? "Die Kamera ist nicht erlaubt. Gib sie in den Browser-Einstellungen für diese Seite frei."
      : "Die Kamera konnte nicht gestartet werden.";
    return;
  }
  const v = $("scVideo");
  if (!v){ stream.getTracks().forEach(t=>t.stop()); return; } // Fenster wurde schon geschlossen
  scan = {stream, alive:true, paused:false, timer:0, ignore:"", ignoreUntil:0};
  v.srcObject = stream;
  try{ await v.play(); }catch(e){}
  const detect = await getDetector();
  if (!scan) return;
  if (!detect){ $("scStatus").textContent = "Die Barcode-Erkennung konnte nicht geladen werden. Bitte einmal mit Internet öffnen."; return; }
  $("scStatus").textContent = joinScan ? "Halte den QR-Code der Einladung in den Rahmen." : "Halte den Barcode in den gelben Rahmen.";
  const tick = async ()=>{
    if (!scan || !scan.alive) return;
    if (!scan.paused && v.readyState >= 2){
      let code = null;
      try{ code = await detect(v); }catch(e){ code = null; }
      if (code && scan && !scan.paused && !(code === scan.ignore && Date.now() < scan.ignoreUntil)) onCode(code);
    }
    if (scan && scan.alive) scan.timer = setTimeout(tick, 160);
  };
  tick();
}
function stopScan(){
  if (!scan) return;
  scan.alive = false; clearTimeout(scan.timer);
  scan.stream.getTracks().forEach(t=>t.stop());
  scan = null;
}
async function onCode(code){
  if (String(code).includes("#join=")){                // QR-Code einer gemeinsamen Liste
    const inv = parseInvite(code); joinScan = false;
    closeSheet();
    if (inv) openJoin(inv); else toast("Dieser QR-Code ist keine gültige Einladung.");
    return;
  }
  if (joinScan){ scan.paused = false; scan.ignore = code; scan.ignoreUntil = Date.now() + 3000; $("scStatus").textContent = "Das ist kein Einladungs-QR-Code."; return; }
  scan.paused = true;
  if (navigator.vibrate) try{ navigator.vibrate(40); }catch(_){}
  const known = state.codes[code];
  if (known){ showFound(code, known, "Kennt der Zettel schon von einem früheren Scan."); return; }
  $("scStatus").textContent = `Barcode ${code} erkannt. Suche das Produkt …`;
  let prod = null, offline = false;
  try{
    const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 7000);
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_de,generic_name_de,brands,quantity,categories_tags`, {signal:ctl.signal});
    clearTimeout(t);
    if (r.ok){ const j = await r.json(); if (j && j.status === 1 && j.product) prod = j.product; }
  }catch(e){ offline = true; }
  if (!$("scResult")) return;
  if (prod){
    const name = String(prod.product_name_de || prod.product_name || prod.generic_name_de || "").trim();
    const brand = String(prod.brands || "").split(",")[0].trim();
    showFound(code, {name: name ? cap(name) : "", qty: normQty(prod.quantity), note: brand, cat: catFromOff(prod.categories_tags) || ""},
      name ? "Gefunden. Du kannst den Namen noch ändern, z. B. kürzer." : "Gefunden, aber ohne Namen. Bitte selbst eintragen.");
  } else {
    showFound(code, {name:"", qty:"", note:"", cat:""}, offline
      ? "Keine Verbindung. Trag den Namen selbst ein, der Zettel merkt ihn sich für den nächsten Scan."
      : "Dieses Produkt kennt die Datenbank nicht. Trag den Namen selbst ein, der Zettel merkt ihn sich für den nächsten Scan.");
  }
}
function showFound(code, p, msg){
  $("scStatus").textContent = msg;
  const meta = [p.note, p.qty].filter(Boolean).join(" · ");
  $("scResult").innerHTML = `<div class="found">
    <div class="field"><label for="fName">Artikel</label><input id="fName" type="text" value="${esc(p.name)}" placeholder="z. B. Haferdrink"></div>
    ${meta ? `<div class="meta">${esc(meta)}</div>` : ""}
    <div class="row"><button class="btn" type="button" id="fAdd">Auf die Liste</button><button class="btn ghost" type="button" id="fAgain">Weiter scannen</button></div>
  </div>`;
  if (!p.name) $("fName").focus();
  const resume = ()=>{
    if (!$("scResult")) return;
    $("scResult").innerHTML = ""; $("scStatus").textContent = "Halte den Barcode in den gelben Rahmen.";
    if (scan){ scan.ignore = code; scan.ignoreUntil = Date.now() + 2500; scan.paused = false; }
  };
  $("fAdd").onclick = ()=>{
    const name = cap($("fName").value.trim());
    if (!name){ $("fName").focus(); return; }
    const cat = CATS[p.cat] && p.cat !== "sonst" && CATS[p.cat].t === currentType() ? p.cat : guessCat(name);
    state.codes[code] = {name, qty:p.qty || "", note:p.note || "", cat};
    lsSet("codes", state.codes);
    const dupEntry = Object.entries(state.items).find(([id,v])=>!v.done && v.name.toLowerCase() === name.toLowerCase());
    if (dupEntry){
      const [dupId, dupItem] = dupEntry;
      const qty = mergeQty(dupItem.qty, p.qty || "");
      api.updateItem(dupId, {qty});
      toast(`${dupItem.name}: jetzt ${qty}`);
    }
    else {
      api.setItem(newId(), {name, qty:p.qty || "", note:p.note || "", cat, done:false, t:Date.now()});
      api.learn([{name, cat, count:true}]);
      toast(`${name} steht jetzt auf der Liste.`);
    }
    resume();
  };
  $("fAgain").onclick = resume;
  $("fName").addEventListener("keydown", e=>{ if (e.key === "Enter"){ e.preventDefault(); $("fAdd").click(); } });
}

  if ($("eShop")) $("eShop").onchange = ()=>{               // anderer Laden → dessen Kategorien anbieten
    st = storeById($("eShop").value);
    const cur = catIn(it, st);
    $("eCat").innerHTML = st.order.map(c=>`<option value="${c}"${c===cur?" selected":""}>${esc(CATS[c].l)}</option>`).join("");
  };
  const preview = ()=>{
    const v = readQty(); const pr = toNum($("ePrice").value);
    $("ePreview").textContent = (v ? "Auf dem Zettel: " + v : "Ohne Mengenangabe") + (pr ? ` · zusammen ${fmtEUR(pr * packs(v))}` : "");
  };
  ["eCount","eAmount","eUnit","ePrice"].forEach(k=>$(k).addEventListener("input", preview));
  preview();

    const name = cap($("eName").value.trim()) || it.name;
    const qty = readQty(); const cat = $("eCat").value;
    const note = $("eNote").value.trim();
    const pr = toNum($("ePrice").value.replace("€", ""));
    const changedCat = cat !== it.cat;
    const patch = {name, qty, cat, note};
    let shopLearn = null;
    if ($("eShop") && $("eShop").value !== shopFor(it, shops).id){ patch.shop = $("eShop").value; shopLearn = storeById(patch.shop); }
    if (pr != null && pr > 0) patch.price = Math.round(pr*100)/100; else delete it.price;
    api.updateItem(id, patch);
    if (changedCat || name !== it.name || patch.price !== undefined) api.learn([{name, cat, count:false, price: patch.price, explicit: changedCat, type: st.type}]);
    if (shopLearn){ const k = name.toLowerCase(); state.freq[k] = Object.assign({name, n:0}, state.freq[k] || {}, {shop: shopLearn.id, shopType: shopLearn.type}); persistLocal(); render(); }
    closeSheet();
  };
  $("eDel").onclick = ()=>{ closeSheet(); deleteItem(id); };
}

function openRoute(forStore){
  const st = (forStore && storeById(forStore)) || currentStore();
  const inMulti = viewOf() === "multi";
  let order = st.order.slice();
  let delArm = false;
  // Das Fenster wird nur einmal aufgebaut. Danach ändert sich nur die Liste, damit nichts nach oben springt.
  const firstTime = !lsGet("tourRoute", 0);
  openSheet(`<h3>Reihenfolge: <span translate="no">${esc(st.name)}</span></h3>
    ${firstTime ? `<div class="introbar" id="rIntro"><span>Zum ersten Mal hier? Ich zeige dir kurz, wie es geht.</span><div class="row"><button class="btn tag" type="button" id="rIntroGo">Kurz zeigen</button><button class="tour-skip" type="button" id="rIntroNo">Nein, danke</button></div></div>` : ""}
    <p class="note">Sortiere die Bereiche so, wie du durch deinen Markt läufst – oben der Eingang. <button class="linkbtn" type="button" id="rHelp">Kurz erklären</button></p>
    <div id="rLearnWrap"></div>
    <ol class="route" id="routeList"></ol>
    <div class="row"><button class="btn" type="button" id="rSave">Reihenfolge speichern</button><span id="rExtra"></span></div>
    <div class="field" id="rNewField" style="margin-top:6px"><label for="rNew">Eigenen Markt anlegen</label>
      <div class="row"><input id="rNew" type="text" placeholder="z. B. Rewe Lister Meile" style="flex:3 1 180px"><button class="btn tag" type="button" id="rAdd" style="flex:1 1 auto">Anlegen</button></div>
      <p class="note">Startet mit der Reihenfolge oben, danach kannst du sie anpassen.</p></div>`);
  const list = $("routeList");
  const sheet = document.querySelector(".sheet");
  const routeTour = ()=>{ lsSet("tourRoute", 1); const bar = $("rIntro"); if (bar) bar.remove(); startTour(ROUTE_STEPS); };
  $("rHelp").onclick = routeTour;
  if (firstTime){
    $("rIntroGo").onclick = routeTour;
    $("rIntroNo").onclick = ()=>{ lsSet("tourRoute", 1); $("rIntro").remove(); };
  }

  function drawList(focus){
    list.innerHTML = order.map((c,ix)=>`<li data-cat="${c}">
      <span class="grip" aria-hidden="true">⠿</span>
      <span class="nm">${esc(CATS[c].l)}</span>
      <button type="button" data-mv="${ix}" data-d="-1" aria-label="${esc(CATS[c].l)} nach oben" ${ix===0?"disabled":""}>↑</button>
      <button type="button" data-mv="${ix}" data-d="1" aria-label="${esc(CATS[c].l)} nach unten" ${ix===order.length-1?"disabled":""}>↓</button>
    </li>`).join("");
    $("rLearnWrap").innerHTML = learnedOrder({order}) ? `<button class="btn tag" type="button" id="rLearn">Reihenfolge aus deinen Häkchen übernehmen</button>` : "";
    if ($("rLearn")) $("rLearn").onclick = ()=>{
      const lo = learnedOrder({order});
      if (lo){ order = lo; drawList(); toast("Reihenfolge übernommen. Zum Behalten speichern."); }
    };
    if (focus){
      const b = list.querySelector(`[data-mv="${focus.ix}"][data-d="${focus.d}"]:not([disabled])`) || list.querySelector(`[data-mv="${focus.ix}"]:not([disabled])`);
      if (b) b.focus({preventScroll:true});
    }
  }
  function drawExtra(){
    $("rExtra").innerHTML = st.builtin
      ? (st.edited ? `<button class="btn ghost" type="button" id="rReset">Auf Vorgabe zurück</button>` : "")
      : `<button class="btn danger" type="button" id="rDel">${delArm ? "Wirklich löschen?" : "Markt löschen"}</button>`;
    if ($("rReset")) $("rReset").onclick = ()=>{ api.removeStore(st.id); closeSheet(); toast("Vorgabe wiederhergestellt."); };
    if ($("rDel")) $("rDel").onclick = ()=>{
      if (!delArm){ delArm = true; drawExtra(); return; }
      api.removeStore(st.id);
      if (inMulti){ const l = curList(); l.shops = (l.shops||[]).filter(x=>x !== st.id); saveLists(); }
      else { storeId = "standard"; lsSet("store",storeId); }
      closeSheet(); render(); toast("Markt gelöscht.");
    };
  }
  drawList(); drawExtra();

  // Pfeile
  list.addEventListener("click", e=>{
    const b = e.target.closest("[data-mv]"); if (!b) return;
    const i = +b.dataset.mv, j = i + (+b.dataset.d);
    if (j<0 || j>=order.length) return;
    [order[i], order[j]] = [order[j], order[i]];
    drawList({ix:j, d:b.dataset.d});
  });

  // Ziehen: Zeile gedrückt halten (oder sofort am Griff ⠿) und beliebig weit nach oben oder unten ziehen.
  // Wichtig: Die gezogene Zeile bleibt im Seitenaufbau stehen, verschoben werden nur die Nachbarn.
  let drag = null;
  list.addEventListener("contextmenu", e=>e.preventDefault());
  // während des Ziehens darf die Seite nicht scrollen (sonst bricht der Browser das Ziehen ab)
  const blockScroll = e=>{ if (drag) e.preventDefault(); };
  document.addEventListener("touchmove", blockScroll, {passive:false});
  list.addEventListener("pointerdown", e=>{
    const li = e.target.closest("li[data-cat]");
    if (!li || drag || e.target.closest("button") || (e.pointerType === "mouse" && e.button !== 0)) return;
    const sx = e.clientX, sy = e.clientY, pid = e.pointerId;
    const begin = ()=>{
      drag = {li, pid, startY: sy};
      li.classList.add("dragging");
      list.classList.add("sorting");
      if (navigator.vibrate) try{ navigator.vibrate(15); }catch(_){}
    };
    if (e.target.closest(".grip") || e.pointerType === "mouse"){ e.preventDefault(); begin(); return; }
    // Finger: erst nach kurzem Halten, damit normales Scrollen weiter geht
    const timer = setTimeout(begin, 300);
    const early = ev=>{ if (ev.pointerId === pid && !drag && Math.hypot(ev.clientX-sx, ev.clientY-sy) > 10) stop(); };
    const stop = ()=>{ clearTimeout(timer); window.removeEventListener("pointermove", early); window.removeEventListener("pointerup", stop); window.removeEventListener("pointercancel", stop); };
    window.addEventListener("pointermove", early);
    window.addEventListener("pointerup", stop);
    window.addEventListener("pointercancel", stop);
  });
  let autoScroll = 0, lastY = 0;
  function moveTo(y){
    lastY = y;
    const li = drag.li;
    li.style.transform = `translateY(${y - drag.startY}px)`;
    // so lange tauschen, bis die Zeile an der richtigen Stelle ist – auch mehrere Plätze auf einmal
    for (let guard = 0; guard < 30; guard++){
      const r = li.getBoundingClientRect(), mid = r.top + r.height/2;
      const prev = li.previousElementSibling, next = li.nextElementSibling;
      let move = null;
      if (next && mid > next.getBoundingClientRect().top + next.offsetHeight/2) move = ()=>list.insertBefore(next, li);               // Nachbar unten nach oben
      else if (prev && mid < prev.getBoundingClientRect().top + prev.offsetHeight/2) move = ()=>list.insertBefore(prev, li.nextSibling); // Nachbar oben nach unten
      if (!move) break;
      const before = li.offsetTop; move(); const after = li.offsetTop;
      drag.startY += (after - before);
      li.style.transform = `translateY(${y - drag.startY}px)`;
    }
  }
  // am oberen/unteren Rand des Fensters mitscrollen
  function edgeScroll(){
    if (!drag){ autoScroll = 0; return; }
    const sr = sheet.getBoundingClientRect();
    const d = lastY < sr.top + 80 ? -10 : lastY > sr.bottom - 80 ? 10 : 0;
    if (d){
      const before = sheet.scrollTop; sheet.scrollTop += d;
      const moved = sheet.scrollTop - before;
      if (moved){ drag.startY -= moved; moveTo(lastY); }
    }
    autoScroll = requestAnimationFrame(edgeScroll);
  }
  window.addEventListener("pointermove", e=>{
    if (!drag || e.pointerId !== drag.pid) return;
    e.preventDefault();
    moveTo(e.clientY);
    if (!autoScroll) autoScroll = requestAnimationFrame(edgeScroll);
  }, {passive:false});
  const endDrag = e=>{
    if (!drag || (e && e.pointerId !== drag.pid)) return;
    cancelAnimationFrame(autoScroll); autoScroll = 0;
    drag.li.classList.remove("dragging");
    drag.li.style.transform = "";
    list.classList.remove("sorting");
    drag = null;
    order = [...list.children].map(li=>li.dataset.cat);
    drawList();
  };
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);
  sheetCleanup = ()=>{ document.removeEventListener("touchmove", blockScroll); window.removeEventListener("pointerup", endDrag); window.removeEventListener("pointercancel", endDrag); };

  $("rSave").onclick = ()=>{ saveOrder(st, order); closeSheet(); toast("Reihenfolge gespeichert."); };
  $("rAdd").onclick = ()=>{
    const name = $("rNew").value.trim(); if (!name){ $("rNew").focus(); return; }
    const id = "m-"+newId();
    api.saveStore(id, {custom:true, name, type:st.type, order});
    if (inMulti){ const l = curList(); l.shops = l.shops || []; if (l.shops.includes(st.id)) l.shops = l.shops.map(x=>x === st.id ? id : x); else l.shops.push(id); saveLists(); }   // eigenen Markt statt Vorlage verwenden
    else { storeId = id; lsSet("store",storeId); curList().store = id; saveLists(); }
    closeSheet(); render(); toast(`${name} angelegt.`);
  };
}

/* ---------- Kopfzeile ein-/ausblenden ---------- */
(function(){
  let lastY = window.scrollY, ticking = false;
  const head = document.querySelector("header");
  window.addEventListener("scroll", ()=>{
    if (ticking) return; ticking = true;
    requestAnimationFrame(()=>{
      const y = window.scrollY, dy = y - lastY;
      if (y < head.offsetHeight) head.classList.remove("away");     // ganz oben immer zeigen
      else if (dy > 6) head.classList.add("away");                   // runter → weg
      else if (dy < -6) head.classList.remove("away");               // hoch → zurück
      if (Math.abs(dy) > 6) lastY = y;
      ticking = false;
    });
  }, {passive:true});
  // Kopfzeile zeigen, wenn eine neue Version bereit ist oder ins Eingabefeld getippt wird
  $("addInput").addEventListener("focus", ()=>head.classList.remove("away"));
})();

/* ---------- Gemeinsame Listen ----------
   Mehrere Handys teilen eine Liste. Änderungen laufen verschlüsselt über einen öffentlichen ntfy-Server
   (Standard: ntfy.sh – kostenlos, ohne Konto). Der Schlüssel steckt nur im Einladungslink, der Server sieht nur Zeichensalat.
   Abgleich: Jeder Artikel hat einen Zeitstempel (m). Die neueste Änderung gewinnt, gelöschte Artikel merkt sich die Liste eine Weile.
   Der Server hebt Nachrichten nur einige Stunden auf. Wer länger offline war, fragt beim Öffnen die anderen nach dem aktuellen Stand. */
const SYNC_DEFAULT = "https://ntfy.sh";
const SYNC_CHUNK = 2400;                 // Zeichen pro Nachricht (ntfy erlaubt 4096 inkl. Verschlüsselung)
const SYNC_DEAD_DAYS = 30;
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u = s => { s = s.replace(/-/g,"+").replace(/_/g,"/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); };
const rndB64 = n => b64u(crypto.getRandomValues(new Uint8Array(n)));
const DEVICE = lsGet("device", "") || (()=>{ const d = rndB64(9); lsSet("device", d); return d; })();
const syncs = new Map();                 // listId → {es, ok, key, timer, retry}
function syncServer(){ return (lsGet("syncServer", "") || SYNC_DEFAULT).replace(/\/+$/, ""); }
function listById(id){ return lists.find(l=>l.id === id); }
function itemsOf(lid){ return lid === listId ? state.items : lsGet(itemsKey(lid), {}); }
function smeta(lid){ return Object.assign({base:{}, dead:{}, pend:{}, last:"", seen:{}, lastOk:0}, lsGet("sync." + lid, {})); }
function ssave(lid, m){ lsSet("sync." + lid, m); }
const itemSig = it => { const o = Object.assign({}, it); delete o.m; return JSON.stringify(o); };

async function syncKey(l){
  const s = syncs.get(l.id) || {};
  if (s.key) return s.key;
  const key = await crypto.subtle.importKey("raw", unb64u(l.share.k), "AES-GCM", false, ["encrypt","decrypt"]);
  s.key = key; syncs.set(l.id, s); return key;
}
async function seal(l, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, await syncKey(l), new TextEncoder().encode(JSON.stringify(obj)));
  const out = new Uint8Array(12 + ct.byteLength); out.set(iv); out.set(new Uint8Array(ct), 12);
  return "e1." + b64u(out);
}
async function unseal(l, txt){
  if (typeof txt !== "string" || !txt.startsWith("e1.")) return null;
  try{
    const b = unb64u(txt.slice(3));
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b.slice(0,12)}, await syncKey(l), b.slice(12));
    return JSON.parse(new TextDecoder().decode(pt));
  }catch(e){ return null; }       // falscher Schlüssel oder fremde Nachricht: ignorieren
}

/* Lokale Änderungen finden: Vergleich mit dem zuletzt abgeglichenen Stand */
let syncHold = false;                     // z. B. während der Tipps-Tour
function syncCheck(lid){
  const l = listById(lid); if (!l || !l.share || syncHold) return;
  const items = itemsOf(lid), m = smeta(lid), now = Date.now();
  let ch = false;
  for (const [id, it] of Object.entries(items)){
    const sig = itemSig(it);
    if (m.base[id] !== sig){ it.m = now; m.base[id] = sig; m.pend[id] = now; delete m.dead[id]; ch = true; }
  }
  for (const id of Object.keys(m.base)) if (!items[id]){ delete m.base[id]; m.dead[id] = now; m.pend[id] = now; ch = true; }
  if (!ch) return;
  try{ localStorage.setItem(LS + "." + itemsKey(lid), JSON.stringify(items)); }catch(e){}   // Zeitstempel mitspeichern
  ssave(lid, m); syncPublishSoon(lid);
}
const syncTimers = {};
function syncTouched(lid){
  if (!window.__syncReady) return;
  const l = listById(lid); if (!l || !l.share) return;
  clearTimeout(syncTimers[lid]); syncTimers[lid] = setTimeout(()=>syncCheck(lid), 500);
}

/* Senden */
const pubTimers = {};
function syncPublishSoon(lid, ms){ clearTimeout(pubTimers[lid]); pubTimers[lid] = setTimeout(()=>syncPublish(lid), ms == null ? 900 : ms); }
async function syncSend(l, obj){
  const body = await seal(l, obj);
  const r = await fetch(`${l.share.s || syncServer()}/${l.share.t}`, {method:"POST", body});
  if (!r.ok) throw new Error("http " + r.status);
}
async function syncPublish(lid){
  const l = listById(lid); if (!l || !l.share) return;
  const s = syncs.get(lid) || {}; if (s.busy){ syncPublishSoon(lid, 1500); return; }
  const m = smeta(lid), snap = Object.assign({}, m.pend), ids = Object.keys(snap);
  if (!ids.length) return;
  const items = itemsOf(lid);
  const msgs = []; let cur = {k:"ops", d:DEVICE, i:{}, x:{}}, size = 0;
  for (const id of ids){
    const part = items[id] ? ["i", items[id]] : (m.dead[id] ? ["x", m.dead[id]] : null);
    if (!part) continue;
    const len = JSON.stringify(part[1]).length + id.length + 6;
    if (size + len > SYNC_CHUNK && size){ msgs.push(cur); cur = {k:"ops", d:DEVICE, i:{}, x:{}}; size = 0; }
    cur[part[0]][id] = part[1]; size += len;
  }
  if (size) msgs.push(cur);
  s.busy = true; syncs.set(lid, s);
  try{
    for (const msg of msgs) await syncSend(l, msg);
    const m2 = smeta(lid);
    for (const id of ids) if (m2.pend[id] === snap[id]) delete m2.pend[id];   // nur, was sich seitdem nicht wieder geändert hat
    ssave(lid, m2); s.retry = 0;
  }catch(e){
    s.retry = Math.min((s.retry || 0) + 1, 6);
    syncPublishSoon(lid, 5000 * Math.pow(2, s.retry - 1));                    // später nochmal (5 s, 10 s, 20 s …)
  }finally{ s.busy = false; syncStatusChanged(); }
}
function syncSendAll(lid){            // allen kompletten Stand schicken (z. B. für ein neues Gerät)
  const items = itemsOf(lid), m = smeta(lid), now = Date.now();
  for (const id of Object.keys(items)) m.pend[id] = now;
  for (const id of Object.keys(m.dead)) m.pend[id] = now;
  ssave(lid, m); syncPublishSoon(lid, 300 + Math.random() * 1500);
}

/* Empfangen */
async function syncApply(lid, obj){
  syncCheck(lid);                                   // eigene, noch nicht erfasste Änderungen zuerst sichern
  const items = itemsOf(lid), m = smeta(lid);
  let changed = false;
  for (const [id, r] of Object.entries(obj.i || {})){
    if (!r || typeof r !== "object" || typeof r.name !== "string") continue;
    const rm = +r.m || 0;
    if ((m.dead[id] || 0) >= rm) continue;
    const L = items[id], lm = L ? (+L.m || 0) : -1;
    if (!L || rm > lm || (rm === lm && obj.d > DEVICE && itemSig(L) !== itemSig(r))){
      items[id] = r; m.base[id] = itemSig(r); delete m.pend[id]; changed = true;
    }
  }
  for (const [id, ts] of Object.entries(obj.x || {})){
    const t = +ts || 0;
    if (items[id] && (+items[id].m || 0) > t) continue;      // hier neuer bearbeitet: bleibt
    if (items[id]){ delete items[id]; changed = true; }
    delete m.base[id]; delete m.pend[id];
    m.dead[id] = Math.max(m.dead[id] || 0, t);
  }
  ssave(lid, m);
  if (!changed) return;
  if (lid === listId){ state.items = items; try{ localStorage.setItem(LS + "." + itemsKey(lid), JSON.stringify(items)); }catch(e){} render(); }
  else { try{ localStorage.setItem(LS + "." + itemsKey(lid), JSON.stringify(items)); }catch(e){} }
}
function syncConnect(lid, since){
  const l = listById(lid); if (!l || !l.share) return;
  syncStop(lid, true);
  const m = smeta(lid);
  const s = syncs.get(lid) || {}; syncs.set(lid, s);
  const q = since || (m.last ? m.last : "");
  const url = `${l.share.s || syncServer()}/${l.share.t}/sse${q ? "?since=" + encodeURIComponent(q) : ""}`;
  let es;
  try{ es = new EventSource(url); }catch(e){ return; }
  s.es = es; s.ok = false;
  // Verbunden: ggf. die anderen nach dem Stand fragen und Liegengebliebenes senden
  const onOpen = ()=>{
    if (s.es !== es) return;
    const first = !s.ok; s.ok = true;
    const mm = smeta(lid); mm.lastOk = Date.now(); ssave(lid, mm);
    if (s.hello){ s.hello = false; syncSend(l, {k:"hello", d:DEVICE, ts:Date.now()}).catch(()=>{ s.hello = true; }); }
    if (first && Object.keys(mm.pend).length) syncPublishSoon(lid, 200);
    if (first) syncStatusChanged();
  };
  const onData = async ev=>{
    let d; try{ d = JSON.parse(ev.data); }catch(e){ return; }
    const mm = smeta(lid);
    if (d.event === "open" || d.event === "keepalive"){ onOpen(); return; }
    if (d.event !== "message") return;
    mm.last = d.id; mm.lastOk = Date.now(); ssave(lid, mm);
    const obj = await unseal(l, d.message);
    if (!obj || obj.d === DEVICE) return;
    const m3 = smeta(lid); m3.seen[obj.d] = Date.now(); ssave(lid, m3);
    if (obj.k === "hello"){ if (Date.now() - (+obj.ts || 0) < 12 * 36e5) syncSendAll(lid); }
    else if (obj.k === "ops") await syncApply(lid, obj);
    syncStatusChanged();
  };
  es.onmessage = onData;
  es.addEventListener("open", onOpen);
  es.addEventListener("keepalive", onData);
  es.onerror = ()=>{
    s.ok = false; syncStatusChanged();
    if (es.readyState === 2){ clearTimeout(s.timer); s.timer = setTimeout(()=>syncConnect(lid), 8000); }
  };
}
function syncStop(lid, keep){
  const s = syncs.get(lid); if (!s) return;
  if (s.es) try{ s.es.close(); }catch(e){}
  clearTimeout(s.timer); s.es = null; s.ok = false;
  if (!keep) syncs.delete(lid);
}
function syncStart(lid, opts){
  const l = listById(lid); if (!l || !l.share) return;
  opts = opts || {};
  const m = smeta(lid);
  // Abgelaufene Löschmarken aufräumen
  const cut = Date.now() - SYNC_DEAD_DAYS * 864e5;
  for (const [id, ts] of Object.entries(m.dead)) if (ts < cut && !m.pend[id]) delete m.dead[id];
  ssave(lid, m);
  const s = syncs.get(lid) || {}; syncs.set(lid, s);
  // Lange nichts gehört (Server hebt nur Stunden auf) oder neu beigetreten: die anderen nach dem Stand fragen
  s.hello = opts.join || !m.lastOk || Date.now() - m.lastOk > 10 * 36e5;
  syncCheck(lid);
  syncConnect(lid, opts.join ? "all" : "");
}
function syncAll(){ for (const l of lists) if (l.share) syncStart(l.id); }
function syncState(lid){
  const l = listById(lid || listId); if (!l || !l.share) return null;
  const s = syncs.get(l.id) || {}, m = smeta(l.id);
  const others = Object.values(m.seen).filter(t=>Date.now() - t < 30 * 864e5).length;
  return {ok: !!s.ok, pending: Object.keys(m.pend).length, devices: others + 1, lastOk: m.lastOk};
}
function syncStatusChanged(){
  const st = syncState(); const ico = $("shareIco");
  if (ico){ ico.hidden = !st; if (st) ico.classList.toggle("off", !st.ok); }
  const box = $("shStatus"); if (box && st) box.innerHTML = syncStatusHtml(st);
}
function syncStatusHtml(st){
  return `<span class="dot${st.ok ? "" : " off"}"></span>${st.ok ? "Verbunden" : "Gerade offline – Änderungen werden nachgeholt"}${st.devices > 1 ? ` · ${st.devices} Geräte` : " · noch niemand beigetreten"}${st.pending && st.ok ? " · sendet …" : ""}`;
}
window.addEventListener("online", ()=>{ for (const l of lists) if (l.share){ syncConnect(l.id); syncPublishSoon(l.id, 500); } });
document.addEventListener("visibilitychange", ()=>{

  for (const l of lists) if (l.share){ const s = syncs.get(l.id); if (!s || !s.es || s.es.readyState === 2) syncStart(l.id); }
});

/* Einladung: Link mit #join=… (Thema, Schlüssel, Name, Server) */
function inviteUrl(l){
  const p = {t:l.share.t, k:l.share.k, n:l.name}; if (l.share.s) p.s = l.share.s;
  return location.origin + location.pathname + "#join=" + b64u(new TextEncoder().encode(JSON.stringify(p)));
}
function parseInvite(txt){
  const mm = String(txt || "").match(/#join=([A-Za-z0-9_-]+)/); if (!mm) return null;
  try{
    const p = JSON.parse(new TextDecoder().decode(unb64u(mm[1])));
    if (!/^[A-Za-z0-9_-]{8,64}$/.test(p.t) || typeof p.k !== "string" || unb64u(p.k).length !== 32) return null;
    if (p.s && !/^https?:\/\/[^\s"'<>]+$/.test(p.s)) return null;
    return {t:p.t, k:p.k, n:String(p.n || "Gemeinsame Liste").slice(0, 40), s:p.s || ""};
  }catch(e){ return null; }
}
function openJoin(inv){
  const have = lists.find(l=>l.share && l.share.t === inv.t);
  if (have){ switchList(have.id); toast(`„${have.name}“ ist schon gemeinsam auf diesem Gerät.`); return; }
  openSheet(`<div class="welcome-ico" aria-hidden="true">👥</div>
    <h3>„${esc(inv.n)}“ beitreten?</h3>
    <p class="note" style="color:var(--fg)">Du wurdest zu einer gemeinsamen Einkaufsliste eingeladen. Danach seht ihr alle dieselbe Liste – was einer einträgt oder abhakt, sehen die anderen sofort.</p>
    <p class="note">Die Liste kommt als neue Liste dazu, deine anderen Listen bleiben, wie sie sind.</p>
    <button class="btn" type="button" id="jnGo">Beitreten</button>
    <button class="btn ghost" type="button" data-close>Abbrechen</button>`);
  $("jnGo").onclick = ()=>{
    const id = "l" + newId();
    lists.push({id, name:inv.n, store:storeId, view:"cat", share:{t:inv.t, k:inv.k, s:inv.s || undefined}});
    saveLists(); switchList(id); closeSheet();
    syncStart(id, {join:true});
    toast(`Beigetreten. Die Liste „${inv.n}“ wird geladen …`);
  };
}
function checkInviteHash(){
  if (!location.hash.startsWith("#join=")) return;
  const inv = parseInvite(location.hash);
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
  if (inv) openJoin(inv); else toast("Der Einladungslink ist unvollständig.");
}

let tourOn = false;
function startTour(steps, opt){
  steps = steps || TOUR_STEPS; opt = opt || {};
  const main = steps === TOUR_STEPS;
  if (tourOn) return; tourOn = true;
  const snapItems = JSON.stringify(state.items), snapFreq = JSON.stringify(state.freq);
  if (main) syncHold = true;                       // Beispiel-Artikel nicht an andere schicken
  const root = document.createElement("div");
  root.className = "tour"; root.setAttribute("role", "dialog"); root.setAttribute("aria-modal", "true"); root.setAttribute("aria-label", "Tipps zur Bedienung");
  root.innerHTML = `<div class="tour-hole"></div><div class="tour-card"><p id="tourTxt"></p><div class="tour-foot"><span class="dots" id="tourDots"></span><button class="tour-skip" type="button" id="tourSkip">Beenden</button><button class="btn" type="button" id="tourNext">Weiter</button></div></div>`;
  document.body.appendChild(root);
  const hole = root.querySelector(".tour-hole"), card = root.querySelector(".tour-card");
  let ix = -1, busy = false;
  // Ziel-Rechteck; bei all:true alle sichtbaren Treffer zusammen (z. B. Mikrofon + Scanner)
  const target = (sel, all)=>{
    const els = [...document.querySelectorAll(sel)].filter(el=>el.offsetParent !== null);
    if (!els.length) return null;
    if (!all) return els[0];
    const rs = els.map(e=>e.getBoundingClientRect());
    const l = Math.min(...rs.map(r=>r.left)), t = Math.min(...rs.map(r=>r.top)), r2 = Math.max(...rs.map(r=>r.right)), b = Math.max(...rs.map(r=>r.bottom));
    return {getBoundingClientRect: ()=>({left:l, top:t, width:r2-l, height:b-t})};
  };
  const place = el=>{
    const head = document.querySelector("header"); if (head) head.classList.remove("away");
    if (!el){ hole.style.cssText = "top:50%;left:50%;width:0;height:0"; card.style.top = "30%"; card.style.bottom = "auto"; return; }
    let r = el.getBoundingClientRect();
    const vh = innerHeight, pad = 6;
    const h = Math.min(r.height, vh * 0.42);                    // lange Liste: nur den oberen Teil zeigen
    hole.style.top = (r.top - pad) + "px"; hole.style.left = (r.left - pad) + "px";
    hole.style.width = (r.width + pad*2) + "px"; hole.style.height = (h + pad*2) + "px";
    if (r.top + h/2 < vh * 0.55){ card.style.top = Math.max(16, Math.min(r.top + h + pad + 14, vh - 200)) + "px"; card.style.bottom = "auto"; }
    else { card.style.bottom = Math.max(16, Math.min(vh - r.top + pad + 14, vh - 200)) + "px"; card.style.top = "auto"; }
  };
  // Ziel sichtbar machen: im Fenster dorthin scrollen, in der Liste nur wenn nötig, Kopfzeile: nach oben
  const bringIntoView = el=>{
    if (!el || !el.closest){ return; }
    if (el.closest(".sheet")){ el.scrollIntoView({block: el.getBoundingClientRect().height > innerHeight * 0.35 ? "start" : "center"}); return; }
    if (el.closest("header")){ window.scrollTo(0, 0); return; }
    const r0 = el.getBoundingClientRect();
    if (r0.top < 80 || r0.top > innerHeight * 0.6) window.scrollTo(0, Math.max(0, scrollY + r0.top - innerHeight * 0.3));
  };
  const show = async ()=>{
    busy = true;
    const st = steps[ix];
    bringIntoView(target(st.sel, false));
    await wait(60);

    $("tourTxt").innerHTML = st.t;
    $("tourDots").textContent = `${ix + 1} von ${steps.length}`;
    $("tourNext").textContent = ix === steps.length - 1 ? (main ? "Los geht’s" : "Verstanden") : "Weiter";
    place(target(st.sel, st.all));
    if (st.demo === "type"){
      const inp = $("addInput"), txt = EN ? "2 milk 500 g mince bananas bread" : "2 Milch 500 g Hack Bananen Brot";
      await wait(500);
      for (let i = 1; i <= txt.length && tourOn; i++){ inp.value = txt.slice(0, i); await wait(45); }
      await wait(450);
      if (tourOn){ inp.value = ""; addFromText(txt); inp.blur(); }
    } else if (st.demo === "tick"){
      await wait(900);
      const li = document.querySelector("#list ul.items li[data-id]");
      if (tourOn && li) toggleItem(li.dataset.id);
      await wait(350);
      const el2 = target(".cart") || target(st.sel); bringIntoView(el2); await wait(60); place(el2);
    }
    busy = false;
  };
  const end = ()=>{
    tourOn = false; root.remove();
    window.removeEventListener("keydown", onKey, true);
    if (main){
      state.items = JSON.parse(snapItems); state.freq = JSON.parse(snapFreq);   // Beispiel-Artikel wieder weg
      persistLocal(); render();
      $("addInput").value = ""; showSugg();
      lsSet("tour", 1); syncHold = false;
      toast("Viel Spaß beim Einkaufen!");
    }
    if (opt.done) opt.done();
  };
  const next = ()=>{ if (busy) return; ix++; if (ix >= steps.length) end(); else show(); };
  $("tourNext").onclick = next;
  $("tourSkip").onclick = end;
  // Escape beendet nur die Tour, nicht das Fenster dahinter
  const onKey = e=>{ if (e.key === "Escape"){ e.stopImmediatePropagation(); e.preventDefault(); end(); } };
  window.addEventListener("keydown", onKey, true);
  addEventListener("resize", ()=>{ if (tourOn && ix >= 0) place(target(steps[ix].sel, steps[ix].all)); });
  next();
}

/* ---------- Updates ----------
   Automatisch: neue Versionen werden sofort geladen; die App lädt neu, sobald nichts offen ist.
   Auf Nachfrage: neue Versionen warten, oben erscheint „Eine neue Version ist da“ mit „Aktualisieren“. */
let updMode = lsGet("updates", "auto") === "manual" ? "manual" : "auto";
let swReg = null, appVersion = "", updateReady = false, reloadWanted = false, reloadPending = false;
const hadController = "serviceWorker" in navigator && !!navigator.serviceWorker.controller;

async function storeUpdateMode(){
  // Der Service Worker liest die Einstellung aus diesem Speicher (er hat keinen Zugriff auf localStorage)
  try{ await (await caches.open("einkaufsliste-settings")).put("update-mode", new Response(updMode)); }catch(e){}
}
function askVersion(worker){
  return new Promise(res=>{
    if (!worker){ res(""); return; }
    const done = v=>{ navigator.serviceWorker.removeEventListener("message", on); res(v); };
    const on = e=>{ if (e.data && e.data.type === "version") done(String(e.data.version).replace(/^.*-v/, "")); };
    navigator.serviceWorker.addEventListener("message", on);
    try{ worker.postMessage({type:"version"}); }catch(e){ done(""); }
    setTimeout(()=>done(""), 1500);
  });
}
function showUpdateReady(){
  updateReady = true;
  if (updMode === "manual"){ if (!updLater()) $("updBar").hidden = false; }
  else applyUpdate();   // Automatisch, z. B. nach dem Umschalten: gleich übernehmen
}
function applyUpdate(){
  if (!swReg || !swReg.waiting) return;
  reloadWanted = true;
  swReg.waiting.postMessage({type:"skip-waiting"});
}
function safeToReload(){ return !$("sheetRoot").innerHTML && !$("addInput").value; }
async function setupUpdates(){
  if (!("serviceWorker" in navigator)) return;
  await storeUpdateMode();
  try{ swReg = await navigator.serviceWorker.register("sw.js"); }catch(e){ return; }
  const watch = w=>{ if (w) w.addEventListener("statechange", ()=>{ if (w.state === "installed" && navigator.serviceWorker.controller) showUpdateReady(); }); };
  swReg.addEventListener("updatefound", ()=>watch(swReg.installing));
  if (swReg.waiting && navigator.serviceWorker.controller) showUpdateReady();
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if (!hadController && !reloadWanted) return;          // allererster Start: nichts neu laden
    if (reloadWanted || safeToReload()) location.reload();
    else reloadPending = true;                            // später, wenn die App im Hintergrund war
  });
  document.addEventListener("visibilitychange", ()=>{
    if (document.visibilityState === "visible"){
      if (reloadPending && safeToReload()) location.reload();
      else if (swReg) swReg.update().catch(()=>{});      // beim Zurückkehren nach Updates schauen
    }
  });
  appVersion = await askVersion(navigator.serviceWorker.controller || swReg.active);
  swReg.update().catch(()=>{});
}
/* „Später“: Hinweis bis zum nächsten Start ausblenden. Aktualisieren geht weiterhin unter Einstellungen → Updates. */
function updLater(){ try{ return sessionStorage.getItem("updLater") === "1"; }catch(e){ return false; } }
$("updLater").addEventListener("click", ()=>{

function scaleQty(qty, f){
  if (!qty || f === 1) return qty || "";
  const q = splitQty(qty);
  const up = n=>fmtNum(Math.ceil(n - 1e-9));
  const sc = n=>fmtNum(Math.round(n * 100) / 100);
  if (q.count && q.amount) return formatQty(up(toNum(q.count) * f), q.amount, q.unit);           // 2 × 500 g
  if (q.amount && q.unit) return formatQty("", MEASURE.has(q.unit.toLowerCase()) ? sc(toNum(q.amount) * f) : up(toNum(q.amount) * f), q.unit);
  if (q.count) return up(toNum(q.count) * f);
  if (q.amount) return sc(toNum(q.amount) * f);
  return qty;
}

    <div class="field"><label for="dName">Name</label><input id="dName" type="text" value="${d ? esc(d.name) : ""}" placeholder="${tpl ? "z. B. Wocheneinkauf" : "z. B. Spaghetti Bolognese"}"></div>
    <div class="field"${tpl ? " hidden" : ""}><label for="dServ">Für wie viele Portionen?</label><input id="dServ" type="text" inputmode="numeric" value="${d ? d.servings || 2 : 2}"></div>
    <div class="field"><label for="dItems">${tpl ? "Artikel" : "Zutaten"}</label>
      <textarea id="dItems" class="ta" placeholder="${tpl ? "Ein Artikel pro Zeile, z. B.&#10;2 l Milch&#10;Brot&#10;10 Eier&#10;Bananen&#10;Kaffee" : "Eine Zutat pro Zeile, z. B.&#10;500 g Hackfleisch&#10;500 g Spaghetti&#10;1 Dose Passata&#10;2 Zwiebeln&#10;Parmesan"}">${d ? esc(dishText(d)) : ""}</textarea></div>
    <p class="note" id="dPrev"></p>
    <button class="btn ghost" type="button" id="dFromList">Offene Artikel der Liste übernehmen</button>
    <div class="row"><button class="btn" type="button" id="dSave">Speichern</button>${d ? `<button class="btn danger" type="button" id="dDel">Löschen</button>` : ""}</div>
    <button class="btn ghost" type="button" id="dBack">Zurück</button>`);
  const preview = ()=>{ const n = parseImport($("dItems").value).length; $("dPrev").textContent = tpl ? (n ? `${n} Artikel erkannt.` : "Mengen wie „2 l Milch“ werden mit übernommen.") : (n ? `${n} Zutaten erkannt. Zutatenlisten von Rezeptseiten kannst du direkt einfügen.` : "Zutatenlisten von Rezeptseiten kannst du direkt einfügen."); };
  $("dItems").addEventListener("input", preview); preview();
  $("dFromList").onclick = ()=>{
    const open = Object.values(state.items).filter(i=>!i.done).sort((a,b)=>(a.t||0)-(b.t||0));
    if (!open.length){ toast("Auf der Liste ist gerade nichts offen."); return; }
    const t = $("dItems").value.trim();
    $("dItems").value = (t ? t + "\n" : "") + open.map(i=>`${i.qty ? i.qty + " " : ""}${i.name}${i.note ? " (" + i.note + ")" : ""}`).join("\n");
    preview();
  };
  $("dBack").onclick = ()=>openDishes();
  $("dSave").onclick = ()=>{
    const name = $("dName").value.trim();
    const items = parseImport($("dItems").value).map(i=>{ const o = {name:i.name, qty:i.qty || "", cat:i.cat}; if (i.note) o.note = i.note; return o; });
    if (!name){ $("dName").focus(); return; }
    if (!items.length){ $("dItems").focus(); toast(tpl ? "Bitte mindestens einen Artikel eintragen." : "Bitte mindestens eine Zutat eintragen."); return; }
    const servings = Math.max(1, Math.round(toNum($("dServ").value) || 2));
    if (d) Object.assign(d, {name, servings, items}); else { const o = {id:"d" + newId(), name, servings, items}; if (tpl) o.tpl = true; state.dishes.push(o); }
    saveDishes(); openDishes(tpl ? "tpl" : "dish"); toast(`„${name}“ gespeichert.`);
  };
  if ($("dDel")) $("dDel").onclick = ()=>{
    if (!armed){ armed = true; $("dDel").textContent = "Wirklich löschen?"; return; }
    state.dishes = state.dishes.filter(x=>x.id !== d.id); saveDishes(); openDishes(tpl ? "tpl" : "dish"); toast(`„${d.name}“ gelöscht.`);
  };
}
function openDishAdd(id){
  const d = state.dishes.find(x=>x.id===id); if (!d) return;
  const tpl = !!d.tpl;
  const base = tpl ? 1 : (d.servings || 2); let serv = base;
  const on = d.items.map(()=>true);
  const draw = ()=>{
    const f = serv / base;
    const openByName = {};
    for (const v of Object.values(state.items)) if (!v.done) openByName[v.name.toLowerCase()] = v;
    $("dList").innerHTML = d.items.map((it,ix)=>{
      const q = scaleQty(it.qty, f); const ex = openByName[it.name.toLowerCase()];
      return `<li class="mrow"><label class="mcheck"><input type="checkbox" data-dix="${ix}" ${on[ix] ? "checked" : ""}>
        <span><span class="mname">${q ? `<b>${esc(q)}</b> ` : ""}<span translate="no">${esc(it.name)}</span>${it.note ? ` <i>(${esc(it.note)})</i>` : ""}</span>${ex ? `<small>Steht schon drauf · ${esc(ex.qty || "1")} → <b>${esc(mergeQty(ex.qty, q) || "1")}</b></small>` : ""}</span></label></li>`;
    }).join("");
    $("dServN").textContent = serv;
    const n = on.filter(Boolean).length;
    $("dGo").disabled = !n;
    $("dGo").textContent = n ? `${n} ${tpl ? "Artikel" : (n === 1 ? "Zutat" : "Zutaten")} auf die Liste` : "Nichts ausgewählt";
  };
  openSheet(`<h3><span translate="no">${esc(d.name)}</span></h3>
    <div class="servrow"${tpl ? " hidden" : ""}><span>Portionen</span>
      <div class="stepper"><button type="button" id="dMinus" aria-label="Weniger Portionen">−</button><b id="dServN">${serv}</b><button type="button" id="dPlus" aria-label="Mehr Portionen">+</button></div></div>
    <p class="note">${tpl ? "Was du gerade nicht brauchst, einfach abwählen." : "Was du zu Hause hast, einfach abwählen. Mengen werden auf die Portionen umgerechnet."}</p>
    <div class="imprev"><ul id="dList"></ul></div>
    ${lists.length > 1 ? `<div class="field"><label for="dTarget">In welche Liste?</label><select id="dTarget">${lists.map(l=>`<option value="${esc(l.id)}"${l.id === listId ? " selected" : ""}><span translate="no">${esc(l.name)}</span></option>`).join("")}</select></div>` : ""}
    <button class="btn" type="button" id="dGo"></button>
    <button class="btn ghost" type="button" id="dBack2">Zurück</button>`);
  $("dList").addEventListener("change", e=>{ const cb = e.target.closest("[data-dix]"); if (cb){ on[+cb.dataset.dix] = cb.checked; draw(); } });
  $("dMinus").onclick = ()=>{ if (serv > 1){ serv--; draw(); } };
  $("dPlus").onclick = ()=>{ if (serv < 40){ serv++; draw(); } };
  $("dBack2").onclick = ()=>openDishes(tpl ? "tpl" : "dish");
  $("dGo").onclick = ()=>{
    const f = serv / base;
    const sel = d.items.filter((_,ix)=>on[ix]).map(it=>({name:it.name, qty:tpl ? it.qty : scaleQty(it.qty, f), note:it.note, cat:it.cat}));
    const target = $("dTarget") ? $("dTarget").value : listId, back = listId;
    if (target !== back) switchList(target);            // kurz in die Ziel-Liste wechseln …
    const before = Object.keys(state.items).length;
    const msgs = addEntries(sel);
    const added = Object.keys(state.items).length - before;
    const tName = curList().name;
    if (target !== back) switchList(back);              // … und zurück
    closeSheet();
    toast(`${d.name}${target !== back ? " → " + tName : ""}: ${[added ? `${added} neu` : "", msgs.length ? `${msgs.length} erhöht` : ""].filter(Boolean).join(", ")}.`);
  };
  draw();
}

/* ---------- Sicherung ----------
   Alle Daten dieser App (Listen, Märkte, Reihenfolgen, Gerichte, Oft gekauft, Barcodes, Design)
   als eine Datei speichern und auf diesem oder einem neuen Handy wiederherstellen. */
const BACKUP_APP = "einkaufsliste-backup";
function backupData(){
  const data = {};
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if (k && k.startsWith(LS + ".") && !k.endsWith(".lastbackup")) data[k.slice(LS.length + 1)] = localStorage.getItem(k);
  }
  return data;
}
function backupSummary(data){
  const get = k=>{ try{ return JSON.parse(data[k] || "null"); }catch(e){ return null; } };
  const ls = get("lists") || [{id:"main"}];
  let items = 0; for (const l of ls) items += Object.keys(get(l.id === "main" ? "items" : "items." + l.id) || {}).length;
  const st = Object.values(get("stores") || {}).filter(x=>x && x.custom).length;
  return `${ls.length} ${ls.length === 1 ? "Liste" : "Listen"} mit ${items} Artikeln · ${(get("dishes") || []).length} Gerichte · ${st} eigene Märkte · ${Object.keys(get("freq") || {}).length} gemerkte Artikel`;
}
function openBackup(restoreObj){
  const lb = lsGet("lastbackup", 0);
  openSheet(`<h3>Sicherung</h3>
    <p class="note">Deine Daten liegen nur auf diesem Handy. Mit einer Sicherung gehen sie nicht verloren, wenn Browserdaten gelöscht werden oder du ein neues Handy bekommst.</p>
    <div class="howto-box"><p class="design-label">Enthalten</p><p class="note" style="color:var(--fg)">${esc(backupSummary(backupData()))}, dazu Reihenfolgen und Design.</p></div>
    <button class="btn" type="button" id="bkSave">Sicherung speichern</button>
    <p class="note">${lb ? "Letzte Sicherung: " + new Date(lb).toLocaleDateString(LOCALE, {day:"numeric", month:"long", year:"numeric"}) : "Noch keine Sicherung gemacht."} Leg die Datei z. B. in Google Drive, iCloud oder schick sie dir selbst per WhatsApp.</p>
    <p class="design-label" style="margin-top:6px">Wiederherstellen</p>
    <label class="btn ghost filebtn" for="bkFile">Sicherungsdatei auswählen</label>
    <input id="bkFile" type="file" accept=".json,application/json" class="visually-hidden">
    <div id="bkRestore"></div>
    <button class="btn ghost" type="button" data-close>Schließen</button>`);
  $("bkSave").onclick = ()=>saveBackup();
  $("bkFile").addEventListener("change", e=>{
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{ let obj = null; try{ obj = JSON.parse(String(rd.result)); }catch(_){} showRestore(obj, f.name); };
    rd.readAsText(f);
  });
  if (restoreObj) showRestore(restoreObj.obj, restoreObj.name);
}
function saveBackup(after){
  const d = new Date(); const pd = n=>String(n).padStart(2,"0");
  const name = `Einkaufsliste-Sicherung-${d.getFullYear()}-${pd(d.getMonth()+1)}-${pd(d.getDate())}.json`;
  const body = JSON.stringify({app:BACKUP_APP, version:1, created:d.toISOString(), data:backupData()}, null, 1);
  const done = ()=>{ lsSet("lastbackup", Date.now()); if (after) after(); else { closeSheet(); toast("Sicherung gespeichert."); } };
  let file = null;
  try{ file = new File([body], name, {type:"application/json"}); }catch(e){}
  if (file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:"Einkaufsliste-Sicherung"}).then(done).catch(e=>{ if (!(e && e.name === "AbortError")) download(); });
    return;
  }
  download();
  function download(){
    const url = URL.createObjectURL(new Blob([body], {type:"application/json"}));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    done();
  }
}
function showRestore(obj, fname){
  const box = $("bkRestore"); if (!box) return;
  if (!obj || obj.app !== BACKUP_APP || !obj.data || typeof obj.data !== "object"){
    box.innerHTML = `<p class="note">„${esc(fname || "Datei")}“ ist keine Sicherung dieser App.</p>`; return;
  }
  let armed = false;
  box.innerHTML = `<div class="howto-box"><p class="design-label">Sicherung vom ${esc(new Date(obj.created).toLocaleDateString(LOCALE, {day:"numeric", month:"long", year:"numeric"}))}</p>
    <p class="note" style="color:var(--fg)">${esc(backupSummary(obj.data))}</p>
    <p class="note">Das ersetzt alle Daten auf diesem Handy durch die Sicherung.</p>
    <button class="btn danger" type="button" id="bkGo">Wiederherstellen</button></div>`;
  $("bkGo").onclick = ()=>{
    if (!armed){ armed = true; $("bkGo").textContent = "Wirklich alles ersetzen?"; return; }
    try{
      const keys = []; for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.startsWith(LS + ".")) keys.push(k); }
      keys.forEach(k=>localStorage.removeItem(k));
      for (const [k,v] of Object.entries(obj.data)) if (typeof v === "string" && /^[\w.\-]+$/.test(k)) localStorage.setItem(LS + "." + k, v);
      localStorage.setItem(LS + ".lastbackup", JSON.stringify(Date.parse(obj.created) || Date.now()));
    }catch(e){ toast("Wiederherstellen hat nicht geklappt: zu wenig Speicher?"); return; }
    location.reload();
  };
}

function openFreq(){
  const draw = ()=>{
    const list = freqTop();
    openSheet(`<h3>Oft gekauft</h3>
      <div class="menu-card">
        <button class="menu-row" type="button" id="fqShow" role="switch" aria-checked="${freqCfg.show ? "true" : "false"}">
          ${ico("star")}<span class="mt"><b>Vorschläge anzeigen</b><small>Antippen setzt den Artikel auf die Liste</small></span><span class="switch" aria-hidden="true"></span>
        </button>
      </div>
      <p class="design-label">Wie viele</p>
      <div class="seg" id="fqMax">${[6,12,20].map(n=>`<button type="button" data-max="${n}" aria-pressed="${freqCfg.max===n ? "true" : "false"}">${n}</button>`).join("")}</div>
      <p class="design-label">Gemerkte Artikel</p>
      ${list.length ? `<ul class="fqlist" id="fqList">${list.map(([k,v])=>`<li><span class="fqname">${esc(v.name||k)}</span><span class="fqn">${v.n}×</span><button type="button" class="fqdel" data-del="${esc(k)}" aria-label="${esc(v.name||k)} entfernen">✕</button></li>`).join("")}</ul>
        <button class="btn danger" type="button" id="fqReset">Alle zurücksetzen</button>`
      : `<p class="note">Noch nichts gemerkt. Was du öfter einträgst, erscheint hier.</p>`}
      <p class="note">Entfernen setzt nur den Zähler zurück. Die gelernte Kategorie bleibt erhalten.</p>
      <button class="btn" type="button" data-close>Fertig</button>`);
    const saveCfg = ()=>{ lsSet("freqcfg", freqCfg); render(); };
    $("fqShow").onclick = ()=>{ freqCfg.show = !freqCfg.show; $("fqShow").setAttribute("aria-checked", freqCfg.show ? "true" : "false"); saveCfg(); };
    $("fqMax").onclick = e=>{ const b = e.target.closest("[data-max]"); if (!b) return; freqCfg.max = +b.dataset.max;
      document.querySelectorAll("#fqMax [data-max]").forEach(x=>x.setAttribute("aria-pressed", +x.dataset.max === freqCfg.max ? "true" : "false")); saveCfg(); };
    if ($("fqList")) $("fqList").onclick = e=>{
      const b = e.target.closest("[data-del]"); if (!b) return;
      const k = b.dataset.del; if (!state.freq[k]) return;
      const old = state.freq[k].n;
      state.freq[k].n = 0; persistLocal(); render();
      b.closest("li").remove();
      toast(`${state.freq[k].name || k} entfernt.`, ()=>{ state.freq[k].n = old; persistLocal(); render(); draw(); });
    };
    let armed = false;
    if ($("fqReset")) $("fqReset").onclick = ()=>{
      if (!armed){ armed = true; $("fqReset").textContent = "Wirklich alle zurücksetzen?"; return; }
      const backup = Object.fromEntries(Object.entries(state.freq).map(([k,v])=>[k, v.n]));
      for (const k in state.freq) state.freq[k].n = 0;
      persistLocal(); render(); draw();
      toast("Oft gekauft zurückgesetzt.", ()=>{ for (const k in backup) if (state.freq[k]) state.freq[k].n = backup[k]; persistLocal(); render(); });
    };
  };
  draw();
}

function openUpdates(){
  const pressed = v=> updMode === v ? "true" : "false";
  openSheet(`<h3>Updates</h3>
    <div class="seg two" id="upMode">
      <button type="button" data-up="auto" aria-pressed="${pressed("auto")}">Automatisch</button>
      <button type="button" data-up="manual" aria-pressed="${pressed("manual")}">Auf Nachfrage</button>
    </div>
    <p class="note" id="upDesc"></p>
    <button class="btn ghost" type="button" id="upCheck">Jetzt nach Updates suchen</button>
    <p class="note" id="upState" aria-live="polite"></p>
    <p class="vers">Installierte Version: ${appVersion ? esc(appVersion) : "unbekannt"}</p>
    <button class="btn" type="button" data-close>Fertig</button>`);
  const desc = ()=>{ $("upDesc").textContent = updMode === "manual"
    ? "Neue Versionen werden im Hintergrund geladen. Oben erscheint dann „Eine neue Version ist da“, und du entscheidest, wann du aktualisierst."
    : "Neue Versionen werden automatisch geladen und übernommen, sobald du gerade nichts eingibst. Du musst nichts tun."; };
  const stateTxt = ()=>{ if (updateReady) $("upState").innerHTML = `Eine neue Version ist bereit. <button class="btn tag" type="button" id="upNow" style="margin-top:8px">Jetzt aktualisieren</button>`;
    if ($("upNow")) $("upNow").onclick = ()=>{ $("upNow").disabled = true; $("upNow").textContent = "Wird geladen …"; applyUpdate(); }; };
  desc(); stateTxt();
  $("upMode").onclick = async e=>{
    const b = e.target.closest("[data-up]"); if (!b) return;
    updMode = b.dataset.up; lsSet("updates", updMode); await storeUpdateMode();
    document.querySelectorAll("#upMode [data-up]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.up === updMode ? "true" : "false"));
    desc();
    if (updMode === "auto"){ $("updBar").hidden = true; if (updateReady) applyUpdate(); }
    else if (updateReady) $("updBar").hidden = false;
  };
  $("upCheck").onclick = async ()=>{
    if (!swReg){ $("upState").textContent = "Updates gehen nur in der installierten App über GitHub Pages."; return; }
    if (!navigator.onLine){ $("upState").textContent = "Keine Internetverbindung. Versuch es später nochmal."; return; }
    $("upCheck").disabled = true; $("upState").textContent = "Suche …";
    try{ await swReg.update(); }catch(e){}
    // kurz warten, bis eine gefundene Version fertig geladen ist
    for (let i = 0; i < 20 && swReg.installing; i++) await new Promise(r=>setTimeout(r, 250));
    $("upCheck").disabled = false;
    if (swReg.waiting){ updateReady = true; stateTxt(); if (updMode === "auto") applyUpdate(); }
    else if (!updateReady) $("upState").textContent = "Du hast die neueste Version.";
  };
}
try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}

// Aus WhatsApp über "Teilen" → Einkaufsliste (Android): der Service Worker legt die Datei im Posteingang ab
(async ()=>{
  const u = new URL(location.href);
  if (!u.searchParams.has("shared")) return;
  history.replaceState(null, "", u.pathname);
  try{
    const c = await caches.open("einkaufszettel-inbox");
    const r = await c.match("inbox");
    if (!r) return;
    const data = await r.json();
    await c.delete("inbox");
    const files = Array.isArray(data.files) ? data.files : [];
    const text = files.length ? files.map(f=>f.text).join("\n\n") : (data.text || "");
    if (text.trim()) openImport({text, name: files.length ? files[0].name : "Geteilter Text"});
  }catch(e){ toast("Die geteilte Datei konnte nicht gelesen werden."); }
})();

// Datei per Doppelklick öffnen (installierte App am PC, Chrome/Edge)
if ("launchQueue" in window){
  window.launchQueue.setConsumer(async params=>{
    if (!params.files || !params.files.length) return;
    try{ const f = await params.files[0].getFile(); openImport({text: await f.text(), name: f.name}); }
    catch(e){ toast("Die Datei konnte nicht gelesen werden."); }
  });
}
})();
